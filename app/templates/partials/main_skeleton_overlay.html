{# اسکلت اولیهٔ سایت عمومی وینور — GPT-ساده: اسپینر نازک مرکزی #}
<style id="vinor-main-sk-styles">
  #vinorMainSkeletonRoot,
  #vinorMainSkeletonRoot * {
    pointer-events: none !important;
  }
  #vinorMainSkeletonRoot {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9fafb;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  html.dark #vinorMainSkeletonRoot {
    background: #030712;
  }
  #vinorMainSkeletonRoot.vinor-sk-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none !important;
  }
  #vinorMainSkeletonRoot .vinor-m-sk-spin {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(148, 163, 184, 0.25);
    border-top-color: #94a3b8;
    animation: vinorMainSkSpin 0.75s linear infinite;
  }
  html.dark #vinorMainSkeletonRoot .vinor-m-sk-spin {
    border-color: rgba(148, 163, 184, 0.2);
    border-top-color: #94a3b8;
  }
  @keyframes vinorMainSkSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #vinorMainSkeletonRoot .vinor-m-sk-spin {
      animation: none;
      opacity: 0.55;
    }
  }
</style>
<div id="vinorMainSkeletonRoot" aria-hidden="true" aria-busy="true" data-vinor-main-skeleton="1">
  <div class="vinor-m-sk-spin" role="presentation"></div>
</div>
<script>
(function () {
  function hideMainSkeleton() {
    var root = document.getElementById('vinorMainSkeletonRoot');
    if (!root || root.getAttribute('data-vinor-sk-dismissed') === '1') return;
    root.setAttribute('data-vinor-sk-dismissed', '1');
    root.setAttribute('aria-busy', 'false');
    root.classList.add('vinor-sk-hidden');
    window.setTimeout(function () {
      try {
        root.remove();
      } catch (_) {}
      var st = document.getElementById('vinor-main-sk-styles');
      if (st && st.parentNode) st.parentNode.removeChild(st);
    }, 220);
  }

  function scheduleHide() {
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(hideMainSkeleton);
    });
  }

  window.hideVinorMainSkeleton = hideMainSkeleton;

  window.addEventListener('pageshow', function (ev) {
    if (ev.persisted) hideMainSkeleton();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleHide);
  } else {
    scheduleHide();
  }
})();
</script>
