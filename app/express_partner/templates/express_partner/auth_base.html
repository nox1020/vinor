<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark vinor-auth-flow">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>{% block title %}ورود | وینور اکسپرس{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="theme-color" content="#050a0e">
  <meta name="vinor-express-auth" content="{{ vinor_express_auth_segment|default('guest') }}">
  <link rel="preload" as="font" href="{{ url_for('static', filename='fonts/vazirmatn-regular.woff2') }}" type="font/woff2" crossorigin>
  <link rel="preload" as="font" href="{{ url_for('static', filename='vendor/fontawesome/webfonts/fa-solid-900.woff2') }}" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/vazirmatn.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ 'express-partner/express-partner-auth.css'|static_version }}">
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="preload" as="script" href="{{ url_for('static', filename='vendor/tailwind/tailwindcdn-3.4.17.js') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="tg-page-shell">
    <div id="vinor-express-page-swap">{% block content %}{% endblock %}</div>
  </div>
  <div id="vinor-express-page-scripts" hidden aria-hidden="true">{% block scripts %}{% endblock %}</div>
  <script src="{{ url_for('static', filename='vendor/tailwind/tailwindcdn-3.4.17.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine/alpine-3.14.1.min.js') }}"></script>
  <script src="{{ 'express-partner/partner-avatar-cache.js'|static_version }}"></script>
  <script src="{{ 'express-partner/dashboard-chrome.js'|static_version }}" defer></script>
  <script src="{{ 'express-partner/premium-card-media.js'|static_version }}" defer></script>
  <script src="{{ 'express-partner/express-pull-refresh.js'|static_version }}" defer></script>
  <script src="{{ 'express-partner/express-nav.js'|static_version }}" defer></script>
  <script>
    window.hoistVinorExpressBodyModals = function () {};
    window.vinorExpressStopAllMedia = function () {};
  </script>
</body>
</html>
