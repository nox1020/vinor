{# اسکلت اولیه — ۱۰۰٪ inline (CSS/SVG/JS) بدون وابستگی شبکه #}
<style id="vinor-partner-sk-styles">
  #vinorPartnerSkeletonRoot,
  #vinorPartnerSkeletonRoot * { box-sizing: border-box; pointer-events: none !important; }
  #vinorPartnerSkeletonRoot {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: #030712;
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(16, 185, 129, 0.18), transparent 58%),
      linear-gradient(180deg, #030712, #050a0e 50%, #030712);
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot {
    background: #f1f5f9;
    background-image: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(16, 185, 129, 0.1), transparent 58%), linear-gradient(180deg, #f8fafc, #f1f5f9);
  }
  #vinorPartnerSkeletonRoot.vinor-sk-hidden { opacity: 0; visibility: hidden; }

  #vinorPartnerSkeletonRoot .vinor-sk-progress {
    flex-shrink: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-progress > i {
    display: block;
    height: 100%;
    width: 42%;
    background: linear-gradient(90deg, transparent, #34d399, #6ee7b7, transparent);
    animation: vinorSkBar 1.1s ease-in-out infinite;
  }

  #vinorPartnerSkeletonRoot .vinor-sk-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 16px 8px;
    gap: 20px;
    min-height: 0;
  }

  #vinorPartnerSkeletonRoot .vinor-sk-hero { text-align: center; }
  #vinorPartnerSkeletonRoot .vinor-sk-logo-box {
    position: relative;
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #34d399;
    border-right-color: rgba(52, 211, 153, 0.3);
    animation: vinorSkSpin 0.85s linear infinite;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-logo-img {
    display: block;
    width: 64px;
    height: 64px;
    border-radius: 14px;
    object-fit: cover;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-title {
    font-size: 17px;
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: 0.02em;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-title { color: #0f172a; }
  #vinorPartnerSkeletonRoot .vinor-sk-sub {
    margin-top: 6px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.5;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #6ee7b7;
    border: 1px solid rgba(52, 211, 153, 0.35);
    background: rgba(6, 78, 59, 0.45);
  }
  #vinorPartnerSkeletonRoot .vinor-sk-badge[hidden] { display: none; }
  #vinorPartnerSkeletonRoot .vinor-sk-badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
  }

  #vinorPartnerSkeletonRoot .vinor-sk-preview {
    width: 100%;
    max-width: 22rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-row {
    display: flex;
    gap: 10px;
    min-height: 88px;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(15, 23, 42, 0.65);
    overflow: hidden;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-row {
    border-color: rgba(0, 0, 0, 0.06);
    background: #fff;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-thumb {
    width: 32%;
    max-width: 5.5rem;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-line {
    height: 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.07);
    position: relative;
    overflow: hidden;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-line,
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-thumb {
    background: #e2e8f0;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-shine::after {
    content: '';
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    animation: vinorSkShine 1.4s ease-in-out infinite;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-shine::after {
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
  }
  #vinorPartnerSkeletonRoot .vinor-sk-d1::after { animation-delay: 0.1s; }
  #vinorPartnerSkeletonRoot .vinor-sk-d2::after { animation-delay: 0.25s; }

  #vinorPartnerSkeletonRoot .vinor-sk-tabs {
    flex-shrink: 0;
    display: flex;
    justify-content: space-around;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(5, 10, 14, 0.94);
  }
  html:not(.dark) #vinorPartnerSkeletonRoot .vinor-sk-tabs {
    border-top-color: rgba(0, 0, 0, 0.06);
    background: rgba(255, 255, 255, 0.96);
  }
  #vinorPartnerSkeletonRoot .vinor-sk-tab {
    width: 44px;
    height: 36px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    position: relative;
    overflow: hidden;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-tab.on {
    background: rgba(16, 185, 129, 0.2);
    box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.35);
  }

  @keyframes vinorSkShine { 100% { transform: translateX(100%); } }
  @keyframes vinorSkSpin { to { transform: rotate(360deg); } }
  @keyframes vinorSkBar {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #vinorPartnerSkeletonRoot .vinor-sk-shine::after,
    #vinorPartnerSkeletonRoot .vinor-sk-ring,
    #vinorPartnerSkeletonRoot .vinor-sk-progress > i { animation: none; }
  }
</style>

<div id="vinorPartnerSkeletonRoot" aria-hidden="true" aria-busy="true" data-vinor-partner-skeleton="1">
  <div class="vinor-sk-progress" aria-hidden="true"><i></i></div>

  <div class="vinor-sk-body">
    <div class="vinor-sk-hero">
      <div class="vinor-sk-logo-box">
        <div class="vinor-sk-ring" aria-hidden="true"></div>
        <img class="vinor-sk-logo-img" src="{{ url_for('static', filename='icons/icon-96.png') }}" alt="" width="64" height="64" decoding="async">
      </div>
      <div class="vinor-sk-title">وینور اکسپرس</div>
      <p class="vinor-sk-sub" id="vinorSkStatusText">در حال بارگذاری…</p>
      <span class="vinor-sk-badge" id="vinorSkOfflineBadge" hidden>
        <span class="vinor-sk-badge-dot" aria-hidden="true"></span>
        آماده برای کار آفلاین
      </span>
    </div>

    <div class="vinor-sk-preview" aria-hidden="true">
      <div class="vinor-sk-row">
        <div class="vinor-sk-thumb vinor-sk-shine vinor-sk-d1"></div>
        <div class="vinor-sk-lines">
          <div class="vinor-sk-line vinor-sk-shine" style="width:72%"></div>
          <div class="vinor-sk-line vinor-sk-shine vinor-sk-d1" style="width:100%"></div>
          <div class="vinor-sk-line vinor-sk-shine vinor-sk-d2" style="width:48%"></div>
        </div>
      </div>
      <div class="vinor-sk-row" style="opacity:0.75">
        <div class="vinor-sk-thumb vinor-sk-shine vinor-sk-d2"></div>
        <div class="vinor-sk-lines">
          <div class="vinor-sk-line vinor-sk-shine vinor-sk-d2" style="width:60%"></div>
          <div class="vinor-sk-line vinor-sk-shine" style="width:88%"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="vinor-sk-tabs" aria-hidden="true">
    <span class="vinor-sk-tab on vinor-sk-shine"></span>
    <span class="vinor-sk-tab vinor-sk-shine vinor-sk-d1"></span>
    <span class="vinor-sk-tab vinor-sk-shine vinor-sk-d2"></span>
    <span class="vinor-sk-tab vinor-sk-shine"></span>
  </nav>
</div>

<script>
(function () {
  var MIN_MS = 0;
  var MAX_MS = 6000;
  var t0 = Date.now();
  var done = false;

  function syncOfflineUi() {
    var on = typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
    try {
      if (window.VinorConnectivity && typeof window.VinorConnectivity.isOnline === 'function') {
        on = !!window.VinorConnectivity.isOnline();
      }
    } catch (_) {}
    var badge = document.getElementById('vinorSkOfflineBadge');
    var txt = document.getElementById('vinorSkStatusText');
    if (badge) badge.hidden = on;
    if (txt) {
      txt.textContent = on
        ? 'در حال بارگذاری…'
        : 'آفلاین هستید';
    }
    if (typeof window.vinorExpressSyncConnectivity === 'function') {
      window.vinorExpressSyncConnectivity(on, { force: true });
    }
  }

  function notifyApkAppReady() {
    try {
      if (!/VinorApp\//i.test(navigator.userAgent || '')) return;
      if (window.VinorNativeShell && typeof window.VinorNativeShell.onAppReady === 'function') {
        window.VinorNativeShell.onAppReady();
      }
    } catch (_) {}
  }

  function hidePartnerSkeleton() {
    if (done) return;
    done = true;
    var root = document.getElementById('vinorPartnerSkeletonRoot');
    if (!root || root.getAttribute('data-vinor-sk-dismissed') === '1') {
      notifyApkAppReady();
      return;
    }
    root.setAttribute('data-vinor-sk-dismissed', '1');
    root.setAttribute('aria-busy', 'false');
    root.classList.add('vinor-sk-hidden');
    notifyApkAppReady();
    window.setTimeout(function () {
      try { root.remove(); } catch (_) {}
      var st = document.getElementById('vinor-partner-sk-styles');
      if (st && st.parentNode) st.parentNode.removeChild(st);
    }, 180);
  }

  function pageReady() {
    var swap = document.getElementById('vinor-express-page-swap');
    return !!(swap && swap.childElementCount > 0);
  }

  function scheduleHide() {
    var wait = Math.max(0, MIN_MS - (Date.now() - t0));
    window.setTimeout(function () {
      if (pageReady()) hidePartnerSkeleton();
    }, wait);
    window.setTimeout(hidePartnerSkeleton, MAX_MS);
  }

  window.hideVinorPartnerSkeleton = hidePartnerSkeleton;
  syncOfflineUi();
  window.addEventListener('online', syncOfflineUi);
  window.addEventListener('offline', syncOfflineUi);
  window.addEventListener('pageshow', function (e) { if (e.persisted) hidePartnerSkeleton(); });

  function boot() {
    if (pageReady()) {
      scheduleHide();
      return;
    }
    var swap = document.getElementById('vinor-express-page-swap');
    if (swap && typeof MutationObserver !== 'undefined') {
      var obs = new MutationObserver(function () {
        if (pageReady()) {
          try { obs.disconnect(); } catch (_) {}
          scheduleHide();
        }
      });
      obs.observe(swap, { childList: true, subtree: false });
    }
    scheduleHide();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
