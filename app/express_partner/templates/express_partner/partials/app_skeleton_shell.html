{# اسکلت اولیه — GPT-ساده: فقط لوگو با پالس ملایم #}
<style id="vinor-partner-sk-styles">
  #vinorPartnerSkeletonRoot,
  #vinorPartnerSkeletonRoot * { box-sizing: border-box; pointer-events: none !important; }
  #vinorPartnerSkeletonRoot {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Vazirmatn, 'Vazirmatn Fallback', Tahoma, sans-serif;
    font-synthesis: none;
    background: #030712;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot {
    background: #f9fafb;
  }
  #vinorPartnerSkeletonRoot.vinor-sk-hidden { opacity: 0; visibility: hidden; }

  #vinorPartnerSkeletonRoot .vinor-sk-hero {
    text-align: center;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-logo-img {
    display: block;
    width: 36px;
    height: 36px;
    margin: 0 auto;
    border-radius: 8px;
    object-fit: cover;
    animation: vinorSkPulse 1.6s ease-in-out infinite;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-sub {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #vinorPartnerSkeletonRoot.vinor-sk-offline .vinor-sk-sub {
    position: static;
    width: auto;
    height: auto;
    margin: 14px 0 0;
    padding: 0;
    overflow: visible;
    clip: auto;
    white-space: normal;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.4;
  }
  html:not(.dark) #vinorPartnerSkeletonRoot.vinor-sk-offline .vinor-sk-sub { color: #64748b; }
  #vinorPartnerSkeletonRoot .vinor-sk-badge {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    color: #6ee7b7;
  }
  #vinorPartnerSkeletonRoot .vinor-sk-badge[hidden] { display: none; }

  @keyframes vinorSkPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    #vinorPartnerSkeletonRoot .vinor-sk-logo-img { animation: none; opacity: 0.85; }
  }
</style>

<div id="vinorPartnerSkeletonRoot" aria-hidden="true" aria-busy="true" data-vinor-partner-skeleton="1">
  <div class="vinor-sk-hero">
    <img class="vinor-sk-logo-img" src="{{ url_for('static', filename='icons/icon-96.png') }}" alt="" width="36" height="36" decoding="async">
    <p class="vinor-sk-sub" id="vinorSkStatusText">بارگذاری…</p>
    <span class="vinor-sk-badge" id="vinorSkOfflineBadge" hidden>آفلاین</span>
  </div>
</div>

<script>
(function () {
  var MIN_MS = 0;
  var MAX_MS = 5000;
  var FONT_WAIT_MS = 420;
  var t0 = Date.now();
  var done = false;
  var hideScheduled = false;
  var maxTimer = 0;

  function syncOfflineUi() {
    var on = typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
    try {
      if (window.VinorConnectivity && typeof window.VinorConnectivity.isOnline === 'function') {
        on = !!window.VinorConnectivity.isOnline();
      }
    } catch (_) {}
    var root = document.getElementById('vinorPartnerSkeletonRoot');
    var badge = document.getElementById('vinorSkOfflineBadge');
    var txt = document.getElementById('vinorSkStatusText');
    if (root) {
      if (on) root.classList.remove('vinor-sk-offline');
      else root.classList.add('vinor-sk-offline');
    }
    if (badge) badge.hidden = on;
    if (txt) {
      txt.textContent = on
        ? 'بارگذاری…'
        : 'اتصال اینترنت قطع است';
    }
    if (!on && typeof window.vinorExpressSyncConnectivity === 'function') {
      window.vinorExpressSyncConnectivity(false, {
        force: true,
        source: 'native',
        message: 'اتصال اینترنت قطع است'
      });
    }
  }

  function notifyApkAppReady() {
    try {
      if (!/VinorApp\//i.test(navigator.userAgent || '')) return;
      if (window.VinorNativeShell && typeof window.VinorNativeShell.onAppReady === 'function') {
        window.VinorNativeShell.onAppReady();
      }
    } catch (_) {}
  }

  function hidePartnerSkeleton() {
    if (done) return;
    done = true;
    if (maxTimer) {
      window.clearTimeout(maxTimer);
      maxTimer = 0;
    }
    var root = document.getElementById('vinorPartnerSkeletonRoot');
    if (!root || root.getAttribute('data-vinor-sk-dismissed') === '1') {
      notifyApkAppReady();
      return;
    }
    root.setAttribute('data-vinor-sk-dismissed', '1');
    root.setAttribute('aria-busy', 'false');
    root.classList.add('vinor-sk-hidden');
    notifyApkAppReady();
    window.setTimeout(function () {
      try { root.remove(); } catch (_) {}
      var st = document.getElementById('vinor-partner-sk-styles');
      if (st && st.parentNode) st.parentNode.removeChild(st);
    }, 180);
  }

  function pageReady() {
    var swap = document.getElementById('vinor-express-page-swap');
    if (!swap || swap.childElementCount === 0) return false;
    if (swap.querySelector(
      '#homeDashboardPage, #partnerRequestsPage, #expressDashboardMain, ' +
      '#commissionsPageMain, #profilePage, #profileEditPage, #landDetailPage, ' +
      '#loginStep1Form, #otpForm, main'
    )) {
      return true;
    }
    return swap.childElementCount > 0;
  }

  function whenFontsReady(cb) {
    var finished = false;
    var timer;
    function go() {
      if (finished || done) return;
      finished = true;
      if (timer) window.clearTimeout(timer);
      cb();
    }
    try {
      if (document.fonts && document.fonts.status === 'loaded') {
        go();
        return;
      }
    } catch (_) {}
    timer = window.setTimeout(go, FONT_WAIT_MS);
    try {
      if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
        document.fonts.ready.then(go, go);
        return;
      }
    } catch (_) {}
    go();
  }

  function scheduleHide() {
    if (hideScheduled || done) return;
    hideScheduled = true;
    var wait = Math.max(0, MIN_MS - (Date.now() - t0));
    window.setTimeout(function () {
      whenFontsReady(function () {
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            if (pageReady()) hidePartnerSkeleton();
          });
        });
      });
    }, wait);
    if (!maxTimer) {
      maxTimer = window.setTimeout(function () {
        maxTimer = 0;
        hidePartnerSkeleton();
      }, MAX_MS);
    }
  }

  window.hideVinorPartnerSkeleton = hidePartnerSkeleton;
  syncOfflineUi();
  window.addEventListener('online', syncOfflineUi);
  window.addEventListener('offline', syncOfflineUi);
  window.addEventListener('pageshow', function (e) { if (e.persisted) hidePartnerSkeleton(); });
  document.addEventListener('vinor:express-page-swap', function () {
    hidePartnerSkeleton();
  }, { once: true });

  function boot() {
    if (pageReady()) {
      scheduleHide();
      return;
    }
    var swap = document.getElementById('vinor-express-page-swap');
    if (swap && typeof MutationObserver !== 'undefined') {
      var obs = new MutationObserver(function () {
        if (pageReady()) {
          try { obs.disconnect(); } catch (_) {}
          scheduleHide();
        }
      });
      obs.observe(swap, { childList: true, subtree: false });
    }
    scheduleHide();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
