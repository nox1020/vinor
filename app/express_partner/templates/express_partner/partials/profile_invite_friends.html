{# بنر دعوت از دوستان — پروفایل کاربران عادی #}
<section class="rounded-2xl border border-sky-600/35 bg-gradient-to-br from-sky-950/90 via-[#12161f] to-[#0f1419] p-4 overflow-hidden relative">
  <div class="absolute -left-6 -bottom-8 w-28 h-28 rounded-full bg-sky-500/10 blur-2xl pointer-events-none"></div>
  <div class="flex items-stretch gap-3 relative">
    <div class="flex-1 min-w-0 flex flex-col justify-center gap-2">
      <h3 class="text-sm font-bold text-white">دعوت از دوستان</h3>
      <p class="text-[11px] text-sky-100/75 leading-relaxed">
        دوستانت را به وینور دعوت کن و لینک اختصاصی خود را با آن‌ها به اشتراک بگذار.
      </p>
      <a href="{{ url_for('express_partner.invite_colleagues') }}"
         class="mt-1 inline-flex items-center justify-center gap-2 self-start rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-4 py-2.5 transition shadow-lg shadow-sky-900/30">
        <i class="fas fa-user-group text-[11px]"></i>
        دعوت از دوست
      </a>
    </div>
    <div class="shrink-0 w-[4.25rem] flex flex-col items-center justify-center text-sky-400/90">
      <div class="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/25 flex items-center justify-center text-3xl shadow-inner">
        <i class="fas fa-share-nodes"></i>
      </div>
    </div>
  </div>
</section>
