{# پیام‌های Vinor AI داخل اسکرول مشترک داشبورد — کامپوزر جدا، پایین صفحه #}
{% if home_ai_enabled|default(false) %}
<style>
  #homeDashboardPage.home-dashboard-page--ai {
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding-bottom: 0;
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-shell {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
  }
  /* کارت‌های داشبورد ثابت بالا؛ فقط چت اسکرول می‌شود */
  #homeDashboardPage.home-dashboard-page--ai .vn-home-top {
    flex-shrink: 0;
    max-height: none;
    overflow: visible;
    background: #030712;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 5;
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* ارتفاع واقعی داک با JS در --vn-home-dock-h ست می‌شود */
    padding-bottom: calc(var(--vn-home-dock-h, 7.5rem) + 0.5rem);
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-scroll::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-urgent-row,
  #homeDashboardPage.home-dashboard-page--ai .vn-home-file-row {
    padding-top: 0.65rem;
    padding-bottom: 0.65rem;
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-empty {
    padding-top: 0.7rem;
    padding-bottom: 0.7rem;
  }

  #aiHomeInline {
    display: block;
    width: 100%;
    color: #f1f5f9;
  }
  #aiHomeInline #aiPageMain.ai-page-shell,
  #aiHomeInline #aiChat.ai-chat-shell {
    display: block;
    min-height: 0;
    overflow: visible;
  }
  #aiHomeInline #aiMessages.ai-messages {
    display: flex;
    flex-direction: column;
    gap: 1.35rem;
    padding: 0.85rem 1rem 1.5rem;
    overflow: visible;
    min-height: 8rem;
  }

  /* کارت‌ها و agent — بقیهٔ استایل پیام از vinor-ai-messages-gpt */
  #homeDashboardPage.home-dashboard-page--ai .vn-home-composer-dock {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.35rem;
    padding: 0;
    margin: 0;
    background: transparent;
    pointer-events: none;
  }
  #homeDashboardPage.home-dashboard-page--ai .vinor-apk-strip-host {
    position: static;
    flex-shrink: 0;
    z-index: auto;
    background: transparent;
    pointer-events: none;
  }
  #homeDashboardPage.home-dashboard-page--ai .vinor-apk-strip-host:not(:has([data-apk-strip])) {
    display: none;
  }
  #homeDashboardPage.home-dashboard-page--ai .vinor-apk-strip-host .vinor-apk-download-strip {
    display: flex;
    margin: 0 0.75rem;
    pointer-events: auto;
  }
  #homeDashboardPage.home-dashboard-page--ai .vn-home-composer-dock > #aiChatForm.ai-composer,
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer {
    position: static;
    left: auto;
    right: auto;
    bottom: auto;
    z-index: auto;
    flex-shrink: 0;
    width: 100%;
    border-top: none;
    margin: 0;
    padding: 0 0.85rem calc(0.45rem + env(safe-area-inset-bottom, 0px) + var(--ai-keyboard-inset, 0px));
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: none !important;
    pointer-events: none;
  }
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__inner,
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__suggestions {
    background: transparent !important;
  }
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__inner {
    pointer-events: auto;
  }
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__suggestions {
    margin-bottom: 0.45rem;
  }
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__suggestions[hidden] {
    display: none !important;
  }
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__chip,
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__shell,
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__send,
  #homeDashboardPage.home-dashboard-page--ai #aiChatForm.ai-composer .ai-composer__input {
    pointer-events: auto;
  }
  html:has(#homeDashboardPage.home-dashboard-page--ai) #bottomNavMenu {
    display: none !important;
  }

  #aiHomeInline .ai-scroll {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #aiHomeInline .ai-scroll::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }
  #aiHomeInline #aiMessages .ai-msg-cards .vinor-premium-card-mobile { display: flex !important; }
  #aiHomeInline #aiMessages .ai-msg-cards .vinor-premium-card > .hidden.sm\:block { display: none !important; }

  .ai-agent-card {
    width: 100%;
    max-width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 0.85rem;
    background: rgba(15, 23, 42, 0.92);
    padding: 0.85rem 0.9rem;
  }
  .ai-agent-card--done { opacity: 0.78; }
  .ai-agent-card__title {
    font-size: 0.92rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 0.45rem;
  }
  .ai-agent-card__body {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    margin-bottom: 0.65rem;
  }
  .ai-agent-line {
    font-size: 0.82rem;
    color: #cbd5e1;
    line-height: 1.45;
  }
  .ai-agent-card__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }
  .ai-agent-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.1rem;
    padding: 0.35rem 0.85rem;
    border-radius: 0.65rem;
    font-size: 0.82rem;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
  }
  .ai-agent-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .ai-agent-btn--confirm { background: #0ea5e9; color: #0f172a; }
  .ai-agent-btn--cancel {
    background: transparent;
    color: #e2e8f0;
    border-color: rgba(255, 255, 255, 0.18);
  }
  .ai-agent-card__note {
    margin-top: 0.55rem;
    font-size: 0.78rem;
    color: #94a3b8;
  }
  .ai-agent-card__note.hidden { display: none; }

  body:has(#aiHomeInline) #epAiFab.ep-ai-chatbox {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>

<div id="aiHomeInline"
     class="is-open"
     role="region"
     aria-label="Vinor AI"
     aria-hidden="false"
     data-open-on-load="{{ '1' if home_ai_open|default(false) else '0' }}"
     data-open-thread="{{ home_ai_open_thread|default('') }}">
  {% set chat_mode = 'home-inline' %}
  {% set omit_composer = true %}
  {% include 'express_partner/partials/ai_chat_panel.html' %}
</div>

<script>
(function () {
  var panel = document.getElementById('aiHomeInline');
  if (!panel) return;

  function homeScrollEl() {
    return document.getElementById('vnHomeScroll') || panel;
  }

  function focusComposer(opts) {
    opts = opts || {};
    var input = document.getElementById('aiInput');
    var form = document.getElementById('aiChatForm');
    var draft = (opts.message || '').trim();
    var thread = (opts.thread || '').trim();

    function afterReady() {
      if (input && draft) {
        input.value = draft;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      setTimeout(function () {
        try {
          if (input) input.focus();
          var sc = homeScrollEl();
          if (sc) sc.scrollTop = sc.scrollHeight;
        } catch (_) {}
        if (opts.autosend && form && draft.length >= 2) {
          try {
            if (typeof form.requestSubmit === 'function') form.requestSubmit();
            else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
          } catch (_) {}
        }
      }, 80);
    }

    if (thread && typeof window.__vinorAiChatSwitchThread === 'function') {
      Promise.resolve(window.__vinorAiChatSwitchThread(thread)).then(afterReady).catch(afterReady);
    } else {
      afterReady();
    }
  }

  function destroyPanel() {
    try {
      if (panel.parentElement) panel.remove();
    } catch (_) {}
    var dock = document.getElementById('vnHomeComposerDock');
    try {
      if (dock) dock.remove();
    } catch (_) {}
    var form = document.getElementById('aiChatForm');
    try {
      if (form && form.closest && form.closest('.vn-home-shell')) form.remove();
    } catch (_) {}
    if (window.vinorAiHome && window.vinorAiHome._panel === panel) {
      window.vinorAiHome = null;
    }
  }

  window.vinorAiHome = {
    open: focusComposer,
    close: function () {},
    isOpen: function () { return true; },
    hoist: function () {},
    destroy: destroyPanel,
    _panel: panel,
    _layer: panel
  };
  window.vinorAiHomeSheet = window.vinorAiHome;

  try {
    if (typeof window.__vinorAiChatSetSheetOpen === 'function') {
      window.__vinorAiChatSetSheetOpen(true);
    }
  } catch (_) {}
  try {
    if (window.vinorSyncAiFab) window.vinorSyncAiFab();
  } catch (_) {}

  window.addEventListener('vinor:express-page-swap', function onSwap() {
    var onHome = /\/express\/partner\/home\/?$/.test(window.location.pathname || '');
    if (!onHome) {
      destroyPanel();
      window.removeEventListener('vinor:express-page-swap', onSwap);
    }
  });

  var shouldFocus = panel.getAttribute('data-open-on-load') === '1';
  var openThread = (panel.getAttribute('data-open-thread') || '').trim();
  if (shouldFocus || openThread) {
    var tries = 0;
    function tryFocus() {
      tries += 1;
      var ready = !openThread || typeof window.__vinorAiChatSwitchThread === 'function';
      if (ready || tries >= 25) {
        focusComposer({ thread: openThread });
        return;
      }
      setTimeout(tryFocus, 40);
    }
    setTimeout(tryFocus, 40);
  }
})();
</script>
{% endif %}
