<script>
(function () {
  window.vinorAuthSubmitBusy = function (form, btn, busyLabel) {
    if (!form || !btn) {
      return {
        lock: function () {},
        isLocked: function () { return false; },
      };
    }
    var locked = false;
    busyLabel = busyLabel || 'لطفاً صبر کنید…';

    function lock() {
      if (locked) return;
      locked = true;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.dataset.vinorAuthBusy = '1';
      btn.innerHTML =
        '<span class="inline-flex w-full items-center justify-center gap-2">' +
        '<i class="fas fa-circle-notch fa-spin text-sm" aria-hidden="true"></i>' +
        '<span>' + busyLabel + '</span></span>';
    }

    function unlock() {
      if (!locked) return;
      locked = false;
      btn.removeAttribute('aria-busy');
      delete btn.dataset.vinorAuthBusy;
      btn.innerHTML = '<span data-btn-label>' + (btn.dataset.vinorAuthLabel || 'ادامه') + '</span>';
      btn.disabled = false;
    }

    if (!form.dataset.authSkipSubmitLock) {
      form.addEventListener('submit', function (e) {
        if (locked) {
          e.preventDefault();
          return;
        }
        lock();
      }, { capture: true });
    }

    return { lock: lock, unlock: unlock, isLocked: function () { return locked; } };
  };
})();
</script>
