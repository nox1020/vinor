{# حباب شناور هدر: منو راست + برند وسط #}
{% set _menu_href = menu_href|default(url_for('express_partner.home', menu=1)) %}
{% set _use_drawer = profile_drawer|default(false) %}
<style>
  .ep-header-float-actions {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
    right: calc(env(safe-area-inset-right, 0px) + 0.75rem);
    left: auto;
    z-index: 72;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
  }
  .ep-header-float-actions .ep-partner-header-btn {
    margin: 0;
  }
  .ep-header-float-brand {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 71;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.625rem;
    padding: 0 1rem;
  }
  .ep-header-float-brand__text {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #f8fafc;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
  }
</style>
<div class="ep-header-float-brand" aria-label="وینور">
  <p class="ep-header-float-brand__text">وینور</p>
</div>
<div class="ep-header-float-actions" aria-label="دسترسی سریع" data-tour="home-menu">
  {% if _use_drawer %}
  <button type="button"
          id="epProfileMenuBtn"
          class="ep-partner-header-btn relative vinor-dash-glass-pill comm-header-glass-btn"
          aria-label="منو"
          title="منو"
          aria-expanded="false"
          aria-controls="epProfileDrawer">
    <i class="fas fa-bars ep-partner-header-btn-icon" aria-hidden="true"></i>
    <span id="aiMenuUnreadDot" class="hidden absolute top-0.5 end-0.5 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-[#030712]" aria-hidden="true"></span>
  </button>
  {% else %}
  <a href="{{ _menu_href }}"
     data-vinor-express-nav
     class="ep-partner-header-btn vinor-dash-glass-pill comm-header-glass-btn"
     aria-label="منو"
     title="منو">
    <i class="fas fa-bars ep-partner-header-btn-icon" aria-hidden="true"></i>
  </a>
  {% endif %}
</div>
{% if _use_drawer %}
<script>
(function () {
  function bindMenuBtn() {
    var btn = document.getElementById('epProfileMenuBtn');
    if (!btn || btn.__vinorDrawerBound) return;
    btn.__vinorDrawerBound = true;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (window.vinorProfileDrawer && typeof window.vinorProfileDrawer.toggle === 'function') {
        window.vinorProfileDrawer.toggle();
      } else if (window.vinorExpressNavigate) {
        window.vinorExpressNavigate("{{ _menu_href }}", { forward: true });
      } else {
        window.location.href = "{{ _menu_href }}";
      }
    });
  }
  bindMenuBtn();
  window.addEventListener('vinor:express-page-swap', bindMenuBtn);
})();
</script>
{% endif %}
