{# باکس شناور Vinor AI — روی داشبورد #}
<style>
  #epAiFab.ep-ai-chatbox {
    position: fixed;
    z-index: 70;
    bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
    left: calc(1.15rem + env(safe-area-inset-left, 0px));
    width: min(20.5rem, calc(100vw - 2.3rem));
    min-height: 3.4rem;
    border-radius: 1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.45rem;
    padding: 0.42rem;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #111111;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  #epAiFab.ep-ai-chatbox:active {
    transform: scale(0.99);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  #epAiFab.ep-ai-chatbox[hidden] {
    display: none !important;
    pointer-events: none;
  }
  #epAiFab .ep-ai-chatbox__input {
    width: 100%;
    height: 2.55rem;
    border: 0;
    outline: 0;
    border-radius: 0.75rem;
    background: #18181b;
    color: #f4f4f5;
    font-size: 0.82rem;
    padding: 0 0.78rem;
  }
  #epAiFab .ep-ai-chatbox__input::placeholder {
    color: #a1a1aa;
  }
  #epAiFab .ep-ai-chatbox__send {
    width: 2.55rem;
    height: 2.55rem;
    border: 0;
    border-radius: 0.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #7c3aed 0%, #6d28d9 100%);
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #epAiFab .ep-ai-chatbox__send:active {
    transform: scale(0.96);
  }
  html.vinor-has-apk-banner #epAiFab.ep-ai-chatbox {
    bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
  }
</style>
<form id="epAiFab"
   action="{{ url_for('express_partner.ai') }}"
   class="ep-ai-chatbox"
   aria-label="Vinor AI Chat"
   title="Vinor AI Chat"
   {% if not show_ai_fab|default(false) %}hidden aria-hidden="true"{% else %}aria-hidden="false"{% endif %}>
  <input type="text"
         id="epAiFabInput"
         class="ep-ai-chatbox__input"
         placeholder="هر سوالی داری بپرس؟"
         autocomplete="off">
  <button type="submit" class="ep-ai-chatbox__send" aria-label="ارسال">
    <i class="fas fa-paper-plane" aria-hidden="true"></i>
  </button>
</form>
<script>
(function () {
  var MAIN = {
    '/express/partner/home': true
  };
  function normPath(path) {
    return (path || '').replace(/\/+$/, '') || '/';
  }
  function syncAiFab() {
    var fab = document.getElementById('epAiFab');
    if (!fab) return;
    var show = !!MAIN[normPath(window.location.pathname)];
    if (show) {
      fab.removeAttribute('hidden');
      fab.style.display = 'flex';
      fab.setAttribute('aria-hidden', 'false');
    } else {
      fab.setAttribute('hidden', 'hidden');
      fab.style.display = 'none';
      fab.setAttribute('aria-hidden', 'true');
    }
  }
  function submitFromHomeBox(ev) {
    var box = document.getElementById('epAiFab');
    var input = document.getElementById('epAiFabInput');
    if (!box || !input) return;
    if (ev) ev.preventDefault();
    var msg = (input.value || '').trim();
    try {
      if (msg) {
        sessionStorage.setItem('vinor_ai_home_prompt', msg);
        sessionStorage.setItem('vinor_ai_home_autosend', '1');
      } else {
        sessionStorage.removeItem('vinor_ai_home_prompt');
        sessionStorage.removeItem('vinor_ai_home_autosend');
      }
    } catch (_) {}
    var href = box.getAttribute('action') || "{{ url_for('express_partner.ai') }}";
    if (window.vinorExpressNavigate) {
      window.vinorExpressNavigate(href, { forward: true });
    } else {
      window.location.href = href;
    }
  }
  function mountFabOnBody() {
    var fab = document.getElementById('epAiFab');
    var nav = document.getElementById('bottomNavMenu');
    if (!fab || !nav || fab.parentElement === document.body) return;
    try { document.body.insertBefore(fab, nav); } catch (_) {}
  }
  window.vinorSyncAiFab = syncAiFab;
  mountFabOnBody();
  syncAiFab();
  var form = document.getElementById('epAiFab');
  if (form) form.addEventListener('submit', submitFromHomeBox);
  document.addEventListener('DOMContentLoaded', function () {
    mountFabOnBody();
    syncAiFab();
    var f = document.getElementById('epAiFab');
    if (f && !f.__boundHomeAiSubmit) {
      f.__boundHomeAiSubmit = true;
      f.addEventListener('submit', submitFromHomeBox);
    }
  });
  window.addEventListener('popstate', function () { syncAiFab(); });
})();
</script>
