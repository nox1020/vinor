{# باکس شناور Vinor AI — روی داشبورد؛ باز کردن لایه چت تمام‌صفحه #}
<style>
  #epAiFab.ep-ai-chatbox {
    position: fixed;
    z-index: 70;
    bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: min(20.5rem, calc(100vw - 2.3rem));
    min-height: 3.4rem;
    border-radius: 1rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.45rem;
    padding: 0.42rem;
    border: 1px solid rgba(124, 58, 237, 0.35);
    background: linear-gradient(180deg, #161022 0%, #111111 100%);
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  #epAiFab.ep-ai-chatbox:active {
    transform: translateX(-50%) scale(0.99);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  #epAiFab.ep-ai-chatbox[hidden] {
    display: none !important;
    pointer-events: none;
  }
  #epAiFab .ep-ai-chatbox__brand {
    position: relative;
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 0.7rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(124, 58, 237, 0.22);
    color: #c4b5fd;
    font-size: 0.82rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  #epAiFab .ep-ai-chatbox__unread {
    position: absolute;
    top: -0.28rem;
    inset-inline-end: -0.28rem;
    min-width: 1rem;
    height: 1rem;
    padding: 0 0.22rem;
    border-radius: 999px;
    background: #ef4444;
    color: #fff;
    font-size: 0.5625rem;
    font-weight: 800;
    line-height: 1rem;
    text-align: center;
    box-shadow: 0 0 0 2px #111111;
    pointer-events: none;
  }
  #epAiFab .ep-ai-chatbox__unread[hidden] {
    display: none !important;
  }
  #epAiFab .ep-ai-chatbox__input {
    width: 100%;
    height: 2.55rem;
    border: 0;
    outline: 0;
    border-radius: 0.75rem;
    background: #18181b;
    color: #f4f4f5;
    font-size: 0.82rem;
    padding: 0 0.78rem;
  }
  #epAiFab .ep-ai-chatbox__input::placeholder {
    color: #a1a1aa;
  }
  #epAiFab .ep-ai-chatbox__send {
    width: 2.55rem;
    height: 2.55rem;
    border: 0;
    border-radius: 0.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #7c3aed 0%, #6d28d9 100%);
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #epAiFab .ep-ai-chatbox__send:active {
    transform: scale(0.96);
  }
  html.vinor-has-apk-banner #epAiFab.ep-ai-chatbox {
    bottom: calc(3.25rem + env(safe-area-inset-bottom, 0px));
  }
  html.vinor-ai-open #epAiFab.ep-ai-chatbox {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(12px);
  }
</style>
<form id="epAiFab"
   action="{{ url_for('express_partner.home', ai=1) }}"
   class="ep-ai-chatbox"
   data-tour="ai-fab"
   data-postchi-thread="{{ postchi_thread_id|default('__postchi__') }}"
   aria-label="Vinor AI Chat"
   title="Vinor AI Chat"
   {% if not show_ai_fab|default(false) %}hidden aria-hidden="true"{% else %}aria-hidden="false"{% endif %}>
  <span class="ep-ai-chatbox__brand" id="epAiFabBrand" role="button" tabindex="0" title="Vinor AI" aria-label="Vinor AI">
    <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
    <span class="ep-ai-chatbox__unread" id="epAiFabUnread" hidden aria-hidden="true">0</span>
  </span>
  <input type="text"
         id="epAiFabInput"
         class="ep-ai-chatbox__input"
         placeholder="هر سوالی داری بپرس؟"
         autocomplete="off"
         minlength="2">
  <button type="submit" class="ep-ai-chatbox__send" aria-label="ارسال">
    <i class="fas fa-paper-plane" aria-hidden="true"></i>
  </button>
</form>
<script>
(function () {
  if (window.__vinorEpAiFabInit) return;
  window.__vinorEpAiFabInit = true;

  var MAIN = {
    '/express/partner/home': true,
  };
  var MIN_MSG_LEN = 2;
  var fabUnread = 0;

  function normPath(path) {
    return (path || '').replace(/\/+$/, '') || '/';
  }

  function postchiThreadId() {
    var box = document.getElementById('epAiFab');
    return (box && box.getAttribute('data-postchi-thread')) || '__postchi__';
  }

  function hasHomeAi() {
    return !!(window.vinorAiHome && typeof window.vinorAiHome.open === 'function');
  }

  function openHomeAi(opts) {
    opts = opts || {};
    if (hasHomeAi()) {
      window.vinorAiHome.open(opts);
      return true;
    }
    var path = normPath(window.location.pathname);
    var base = MAIN[path] ? path : '/express/partner/home';
    var q = 'ai=1';
    if (opts.thread) q += '&thread=' + encodeURIComponent(opts.thread);
    var href = base + '?' + q;
    if (window.vinorExpressNavigate) {
      window.vinorExpressNavigate(href, { forward: true });
    } else {
      window.location.href = href;
    }
    return false;
  }

  function setFabUnread(n) {
    fabUnread = Math.max(0, Number(n) || 0);
    var el = document.getElementById('epAiFabUnread');
    if (!el) return;
    if (fabUnread > 0) {
      el.textContent = fabUnread > 99 ? '99+' : String(fabUnread);
      el.removeAttribute('hidden');
      el.setAttribute('aria-hidden', 'false');
    } else {
      el.textContent = '0';
      el.setAttribute('hidden', 'hidden');
      el.setAttribute('aria-hidden', 'true');
    }
  }

  function syncAiFab() {
    var fab = document.getElementById('epAiFab');
    if (!fab) return;
    var path = normPath(window.location.pathname);
    var hasLayer = !!document.getElementById('aiHomeLayer');
    var hasInline = !!document.getElementById('aiHomeInline');
    /* اینلاین خانه = چت همیشه روی صفحه؛ FAB فقط برای لایه تمام‌صفحه */
    var show = !!MAIN[path] && hasLayer && !hasInline;
    if (show && document.documentElement.classList.contains('vinor-ai-open')) {
      show = false;
    }
    if (show) {
      fab.removeAttribute('hidden');
      fab.style.display = 'grid';
      fab.setAttribute('aria-hidden', 'false');
    } else {
      fab.setAttribute('hidden', 'hidden');
      fab.style.display = 'none';
      fab.setAttribute('aria-hidden', 'true');
      try {
        if (!MAIN[path] && window.vinorAiHome && window.vinorAiHome.close) {
          window.vinorAiHome.close();
        }
      } catch (_) {}
    }
  }

  function openChat(msg, autosend, thread) {
    openHomeAi({
      message: msg || '',
      autosend: !!autosend,
      thread: thread || ''
    });
  }

  function submitFromHomeBox(ev) {
    var input = document.getElementById('epAiFabInput');
    if (ev) ev.preventDefault();
    var msg = (input && input.value || '').trim();
    if (input) input.value = '';
    if (msg.length >= MIN_MSG_LEN) {
      openChat(msg, true, '');
    } else {
      openChat('', false, '');
    }
  }

  function quickOpenAi(ev) {
    if (ev && ev.target) {
      var t = ev.target;
      if (t.closest && (t.closest('#epAiFabInput') || t.closest('.ep-ai-chatbox__send'))) return;
      if (t.closest && t.closest('#epAiFabBrand') && fabUnread > 0) {
        if (ev.preventDefault) ev.preventDefault();
        openChat('', false, postchiThreadId());
        return;
      }
    }
    openChat('', false, '');
  }

  function mountFabOnBody() {
    var fab = document.getElementById('epAiFab');
    if (!fab || fab.parentElement === document.body) return;
    var nav = document.getElementById('bottomNavMenu');
    try {
      if (nav) document.body.insertBefore(fab, nav);
      else document.body.appendChild(fab);
    } catch (_) {}
  }

  window.vinorSyncAiFab = syncAiFab;
  mountFabOnBody();
  syncAiFab();

  var form = document.getElementById('epAiFab');
  if (form) {
    form.addEventListener('submit', submitFromHomeBox);
    form.addEventListener('click', quickOpenAi);
  }

  window.addEventListener('vinor:notifications:update', function (ev) {
    var detail = ev && ev.detail;
    if (!detail || detail.unread === undefined || detail.unread === null) return;
    setFabUnread(detail.unread);
  });

  try {
    if (window.VinorNotifyCenter && typeof window.VinorNotifyCenter.getState === 'function') {
      var st = window.VinorNotifyCenter.getState();
      if (st && typeof st.unread !== 'undefined') setFabUnread(st.unread);
    }
  } catch (_) {}

  window.addEventListener('popstate', function () { syncAiFab(); });
  window.addEventListener('vinor:express-page-swap', function () {
    mountFabOnBody();
    syncAiFab();
  });
})();
</script>
