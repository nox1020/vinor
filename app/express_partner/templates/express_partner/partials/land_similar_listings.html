{% if related_lands %}
<section class="mt-6 mb-2 rounded-2xl border border-white/10 bg-[#0f1419] p-4" aria-label="فایل‌های مشابه">
  <h2 class="text-sm font-bold text-white mb-3">فایل‌های مشابه</h2>
  <ul class="space-y-2">
    {% for item in related_lands %}
    <li>
      <a href="{{ url_for('express_partner.land_detail', code=item.code) }}"
         class="flex items-center justify-between gap-3 rounded-xl border border-white/5 bg-[#121a22] px-3 py-2.5 hover:border-teal-500/30 transition-colors">
        <span class="min-w-0">
          <span class="block text-[12px] font-semibold text-white truncate">{{ item.title or ('فایل ' ~ item.code) }}</span>
          <span class="block text-[10px] text-slate-400 truncate">{{ [item.city, item.category]|select|join(' · ') }}</span>
        </span>
        <i class="fas fa-chevron-left text-[10px] text-teal-400 shrink-0" aria-hidden="true"></i>
      </a>
    </li>
    {% endfor %}
  </ul>
  <p class="mt-3 text-center">
    <a href="{{ url_for('express_partner.dashboard') }}" class="text-[11px] font-medium text-teal-400 hover:text-teal-300">
      مشاهده همه فایل‌های اکسپرس
    </a>
  </p>
</section>
{% endif %}
