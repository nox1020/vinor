{# بنر دانلود/بروزرسانی اپ — بدون منوی تب پایین #}
<style>
  #bottomNavMenu.tg-tabbar-shell {
    pointer-events: none;
    box-shadow: none !important;
    background: transparent;
    padding-left: max(1rem, env(safe-area-inset-left, 0px));
    padding-right: max(1rem, env(safe-area-inset-right, 0px));
    padding-top: 0.35rem;
    padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));
  }
  .vinor-apk-download-strip {
    pointer-events: auto;
    margin: 0 0.75rem 0.5rem;
    padding: 0.5rem 0.65rem;
    border-radius: 0.85rem;
    border: 1px solid rgba(245, 158, 11, 0.35);
    background: #161616;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: inherit;
    touch-action: pan-y;
    will-change: transform, opacity;
    transition: border-color 0.2s ease, transform 0.15s ease, opacity 0.15s ease;
  }
  .vinor-apk-download-strip:active {
    transform: scale(0.99);
  }
  .vinor-apk-download-strip.is-swipe-dismissing {
    pointer-events: none;
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .vinor-apk-download-strip__icon {
    flex-shrink: 0;
    width: 2rem;
    height: 2rem;
    border-radius: 0.65rem;
    display: grid;
    place-items: center;
    background: rgba(245, 158, 11, 0.2);
    color: #fbbf24;
    font-size: 0.85rem;
  }
  .vinor-apk-download-strip__text {
    flex: 1;
    min-width: 0;
    text-align: right;
  }
  .vinor-apk-download-strip__title {
    font-size: 0.7rem;
    font-weight: 700;
    color: #fef3c7;
    line-height: 1.25;
  }
  .vinor-apk-download-strip__sub {
    font-size: 0.62rem;
    color: rgba(212, 212, 216, 0.95);
    margin-top: 0.1rem;
    line-height: 1.3;
  }
  .vinor-apk-download-strip__cta {
    flex-shrink: 0;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.35rem 0.55rem;
    border-radius: 0.5rem;
    background: #f59e0b;
    color: #1c1917;
    white-space: nowrap;
  }
  .vinor-apk-download-strip--update {
    border-color: rgba(245, 158, 11, 0.45);
    background: #161616;
  }
  .vinor-apk-download-strip--update .vinor-apk-download-strip__icon {
    background: rgba(245, 158, 11, 0.2);
    color: #fcd34d;
  }
  .vinor-apk-download-strip--update .vinor-apk-download-strip__cta {
    background: #fbbf24;
  }
</style>
<nav id="bottomNavMenu" data-tour="bottom-nav" class="tg-tabbar-shell fixed inset-x-0 bottom-0 z-[60]" aria-label="بنر اپلیکیشن">
  {# روی خانهٔ AI بنر بالای کامپوزر است؛ اینجا فقط صفحات بدون کامپوزر #}
  {% if not home_ai_enabled|default(false) %}
  {% include 'express_partner/partials/apk_download_strip.html' %}
  {% endif %}
</nav>

<script>
(function() {
  {% if show_apk_strip and android_apk_url %}
  try { document.documentElement.classList.add('vinor-has-apk-banner'); } catch (_) {}
  {% endif %}
  const userLoggedIn = {{ 'true' if session.get('user_phone') else 'false' }};
  const isVinorApk = {{ 'true' if is_vinor_apk|default(false) else 'false' }};
  const serverShowAppUpdate = {{ 'true' if show_app_update_nav|default(false) else 'false' }};
  const serverShowApkStrip = {{ 'true' if show_apk_strip|default(false) else 'false' }};
  const serverApkStripMode = {{ (apk_strip_mode or 'install')|tojson }};
  const serverApkVersion = {{ (android_apk_version or '')|tojson }};
  const serverApkUrl = {{ (android_apk_url or '')|tojson }};
  const bottomNavShell = document.getElementById('bottomNavMenu');
  if (!bottomNavShell && !document.querySelector('[data-apk-strip-host]')) return;

  function getApkStripMount() {
    return document.querySelector('[data-apk-strip-host]') || document.getElementById('bottomNavMenu');
  }

  function isVinorApkClient() {
    if (isVinorApk) return true;
    try {
      if (window.VINOR_NOTIFY_CFG && window.VINOR_NOTIFY_CFG.isVinorApk) return true;
    } catch (_) {}
    try {
      return /VinorApp\//i.test(navigator.userAgent || '');
    } catch (_) {
      return false;
    }
  }

  const UPDATE_NAV_KEY = 'vinor_express_app_update_nav_v1';
  const APP_VERSION_URLS = ['/api/express/app-version', '/api/app/version'];

  function formatBadgeCount(n) {
    const x = Math.max(0, Number(n) || 0);
    if (x <= 0) return '';
    if (x > 99) return '۹۹+';
    try {
      return String(x).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
    } catch (_) {
      return String(x);
    }
  }

  function setNavBadge(navKey, count) {
    const n = Math.max(0, Number(count) || 0);
    const text = n <= 0 ? '' : formatBadgeCount(n);
    document.querySelectorAll('[data-profile-badge="' + navKey + '"]').forEach(function (el) {
      if (n <= 0) {
        el.textContent = '';
        el.classList.remove('is-visible');
        el.setAttribute('aria-hidden', 'true');
      } else {
        el.textContent = text;
        el.classList.add('is-visible');
        el.setAttribute('aria-hidden', 'false');
      }
    });
  }

  function readFavoritesCount() {
    if (!userLoggedIn) return 0;
    try {
      if (typeof window.vinorReadFavs === 'function') {
        return window.vinorReadFavs().length;
      }
      var raw = localStorage.getItem('vinor_dashboard_favs');
      var arr = JSON.parse(raw || '[]');
      return Array.isArray(arr) ? arr.length : 0;
    } catch (_) {
      return 0;
    }
  }

  function syncFavoritesBadge() {
    setNavBadge('favorites', readFavoritesCount());
  }

  function syncAllNavBadges() {
    syncFavoritesBadge();
    try {
      if (window.VinorNotifyCenter && typeof window.VinorNotifyCenter.getState === 'function') {
        var st = window.VinorNotifyCenter.getState();
        if (st && typeof st.unread !== 'undefined') {
          setNavBadge('notifications', st.unread);
        }
      }
    } catch (_) {}
  }

  function persistUpdateNav(state) {
    try {
      if (state && state.show) {
        sessionStorage.setItem(UPDATE_NAV_KEY, JSON.stringify({
          show: true,
          version: state.version || '',
          url: state.url || '',
          ts: Date.now()
        }));
      } else {
        sessionStorage.removeItem(UPDATE_NAV_KEY);
      }
    } catch (_) {}
  }

  function readUpdateNav() {
    try {
      const raw = sessionStorage.getItem(UPDATE_NAV_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed && parsed.show ? parsed : null;
    } catch (_) {
      return null;
    }
  }

  function getApkStripEl() {
    return document.querySelector('[data-apk-strip]');
  }

  function apkStripDismissedThisEntry() {
    return !!window.__vinorApkStripDismissedThisEntry;
  }

  function setApkBannerClass(on) {
    try {
      if (on) document.documentElement.classList.add('vinor-has-apk-banner');
      else document.documentElement.classList.remove('vinor-has-apk-banner');
    } catch (_) {}
  }

  function dismissApkStripBySwipe(strip, dx) {
    if (!strip) return;
    window.__vinorApkStripDismissedThisEntry = true;
    const dir = dx < 0 ? -1 : 1;
    strip.classList.add('is-swipe-dismissing');
    strip.style.transform = 'translateX(' + (dir * 110) + '%)';
    strip.style.opacity = '0';
    setApkBannerClass(false);
    window.setTimeout(function () {
      if (strip && strip.parentNode) strip.parentNode.removeChild(strip);
    }, 190);
  }

  function resetApkStripDrag(strip) {
    if (!strip) return;
    strip.style.transform = '';
    strip.style.opacity = '';
  }

  function bindApkStripSwipe(strip) {
    if (!strip || strip.getAttribute('data-apk-strip-swipe-bound') === '1') return;
    strip.setAttribute('data-apk-strip-swipe-bound', '1');

    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let dragging = false;
    let swiped = false;
    const threshold = 76;

    function begin(x, y) {
      startX = lastX = x;
      startY = lastY = y;
      dragging = true;
      swiped = false;
    }

    function move(x, y, ev) {
      if (!dragging) return;
      lastX = x;
      lastY = y;
      const dx = x - startX;
      const dy = y - startY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      if (absX < 8 && absY < 8) return;
      if (absX <= absY * 1.15) return;
      swiped = true;
      if (ev && ev.cancelable) ev.preventDefault();
      strip.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 58) + 'deg)';
      strip.style.opacity = String(Math.max(0.35, 1 - absX / 190));
    }

    function end() {
      if (!dragging) return;
      dragging = false;
      const dx = lastX - startX;
      const dy = lastY - startY;
      if (swiped && Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy) * 1.4) {
        dismissApkStripBySwipe(strip, dx);
        return;
      }
      resetApkStripDrag(strip);
    }

    if (window.PointerEvent) {
      strip.addEventListener('pointerdown', function (ev) {
        if (ev.button !== 0) return;
        begin(ev.clientX, ev.clientY);
      });
      strip.addEventListener('pointermove', function (ev) {
        move(ev.clientX, ev.clientY, ev);
      });
      strip.addEventListener('pointerup', end);
      strip.addEventListener('pointercancel', function () {
        dragging = false;
        resetApkStripDrag(strip);
      });
    } else {
      strip.addEventListener('touchstart', function (ev) {
        const t = ev.touches && ev.touches[0];
        if (t) begin(t.clientX, t.clientY);
      }, { passive: true });
      strip.addEventListener('touchmove', function (ev) {
        const t = ev.touches && ev.touches[0];
        if (t) move(t.clientX, t.clientY, ev);
      }, { passive: false });
      strip.addEventListener('touchend', end);
      strip.addEventListener('touchcancel', function () {
        dragging = false;
        resetApkStripDrag(strip);
      });
    }

    strip.addEventListener('click', function (ev) {
      if (!swiped) return;
      ev.preventDefault();
      ev.stopPropagation();
      swiped = false;
    }, true);
  }

  function bindExistingApkStripSwipe() {
    const strip = getApkStripEl();
    if (!strip) {
      setApkBannerClass(false);
      return;
    }
    if (apkStripDismissedThisEntry()) {
      strip.remove();
      setApkBannerClass(false);
      return;
    }
    bindApkStripSwipe(strip);
    setApkBannerClass(true);
  }

  function removeInstallApkStrip() {
    const strip = getApkStripEl();
    if (strip && strip.getAttribute('data-apk-strip-mode') === 'install') {
      strip.remove();
      setApkBannerClass(false);
    }
  }

  function renderApkStrip(show, opts) {
    const mount = getApkStripMount();
    if (!mount) return;
    opts = opts || {};
    if (!show) {
      const existing = getApkStripEl();
      if (existing) existing.remove();
      setApkBannerClass(false);
      return;
    }
    if (apkStripDismissedThisEntry()) {
      const existing = getApkStripEl();
      if (existing) existing.remove();
      setApkBannerClass(false);
      return;
    }
    const inApk = isVinorApkClient();
    if (inApk && opts.mode === 'install') return;
    const mode = opts.mode || (inApk ? 'update' : 'install');
    const url = String(opts.url || serverApkUrl || '').trim();
    const version = String(opts.version || serverApkVersion || '').trim();
    if (!url) return;

    let strip = getApkStripEl();
    if (!strip) {
      strip = document.createElement('a');
      strip.className = 'vinor-apk-download-strip';
      strip.setAttribute('data-apk-strip', '');
      strip.setAttribute('download', '');
      strip.setAttribute('rel', 'noopener');
      mount.appendChild(strip);
    } else if (strip.parentNode !== mount) {
      mount.appendChild(strip);
    }
    strip.href = mode === 'update' && inApk ? '#' : url;
    strip.setAttribute('data-apk-strip-mode', mode);
    if (mode === 'update' && inApk) {
      strip.setAttribute('data-apk-update-url', url);
      strip.removeAttribute('download');
    } else {
      strip.removeAttribute('data-apk-update-url');
      strip.setAttribute('download', '');
    }
    strip.classList.toggle('vinor-apk-download-strip--update', mode === 'update');
    strip.setAttribute('aria-label', mode === 'update' ? 'بروزرسانی اپلیکیشن وینور' : 'دانلود اپلیکیشن وینور اندروید');

    const icon = mode === 'update' ? 'fa-arrow-circle-up' : 'fa-mobile-alt';
    const title = mode === 'update' ? 'بروزرسانی کنید' : 'برای تجربه بهتر، اپلیکیشن وینور را نصب کنید';
    const cta = mode === 'update' ? 'بروزرسانی' : 'دانلود';
    const sub = version
      ? (mode === 'update' ? ('نسخه جدید ' + version) : ('نسخه ' + version))
      : '';

    strip.innerHTML =
      '<span class="vinor-apk-download-strip__icon" aria-hidden="true"><i class="fas ' + icon + '"></i></span>' +
      '<span class="vinor-apk-download-strip__text">' +
      '<span class="vinor-apk-download-strip__title" data-apk-strip-title>' + title + '</span>' +
      '<span class="vinor-apk-download-strip__sub" data-apk-strip-sub>' + sub + '</span></span>' +
      '<span class="vinor-apk-download-strip__cta" data-apk-strip-cta>' + cta + '</span>';

    bindApkStripSwipe(strip);
    setApkBannerClass(true);
    if (mode === 'update' && inApk) syncNativeDownloadUi();
  }

  function ensureNativeApkDownload(opts) {
    opts = opts || {};
    const url = String(opts.url || serverApkUrl || '').trim();
    const version = String(opts.version || serverApkVersion || '').trim();
    if (!url || !version) return;
    try {
      if (window.VinorNativeAppUpdate && typeof window.VinorNativeAppUpdate.ensureDownload === 'function') {
        window.VinorNativeAppUpdate.ensureDownload(url, version);
      }
    } catch (_) {}
  }

  function applyApkDownloadUi(detail) {
    const strip = getApkStripEl();
    if (!strip || strip.getAttribute('data-apk-strip-mode') !== 'update') return;
    const sub = strip.querySelector('[data-apk-strip-sub]');
    const cta = strip.querySelector('[data-apk-strip-cta]');
    const status = String((detail && detail.status) || '').toLowerCase();
    const version = String((detail && detail.version) || serverApkVersion || '').trim();
    if (status === 'downloading') {
      if (sub) sub.textContent = 'در حال دانلود بروزرسانی…';
      if (cta) cta.textContent = 'دانلود';
      strip.setAttribute('data-apk-download-status', 'downloading');
      return;
    }
    if (status === 'ready') {
      if (sub) sub.textContent = version ? ('نسخه جدید ' + version + ' — آماده نصب') : 'آماده نصب';
      if (cta) cta.textContent = 'نصب';
      strip.setAttribute('data-apk-download-status', 'ready');
      return;
    }
    if (status === 'failed') {
      if (sub) sub.textContent = 'خطا در دانلود — دوباره تلاش کنید';
      if (cta) cta.textContent = 'بروزرسانی';
      strip.setAttribute('data-apk-download-status', 'failed');
      return;
    }
    strip.removeAttribute('data-apk-download-status');
    if (sub && version) sub.textContent = 'نسخه جدید ' + version;
  }

  function syncNativeDownloadUi() {
    if (!isVinorApkClient()) return;
    try {
      if (window.VinorNativeAppUpdate && typeof window.VinorNativeAppUpdate.getDownloadState === 'function') {
        const raw = window.VinorNativeAppUpdate.getDownloadState();
        const st = raw ? JSON.parse(raw) : null;
        if (st) applyApkDownloadUi(st);
      }
    } catch (_) {}
  }

  function triggerApkUpdateInstall() {
    const strip = getApkStripEl();
    const status = strip && strip.getAttribute('data-apk-download-status');
    if (status === 'downloading') return;
    try {
      if (window.VinorNativeAppUpdate && typeof window.VinorNativeAppUpdate.installUpdate === 'function') {
        const installed = window.VinorNativeAppUpdate.installUpdate();
        if (!installed) {
          const stored = readUpdateNav() || {};
          const url = (strip && strip.getAttribute('data-apk-update-url')) || stored.url || serverApkUrl;
          const version = stored.version || serverApkVersion;
          ensureNativeApkDownload({ url: url, version: version });
        }
        return;
      }
    } catch (_) {}
    if (strip) {
      const fallbackUrl = strip.getAttribute('data-apk-update-url') || strip.href;
      if (fallbackUrl && fallbackUrl !== '#') window.location.href = fallbackUrl;
    }
  }

  function applyUpdateNav(show, opts) {
    opts = opts || {};
    if (!isVinorApkClient()) {
      /* مرورگر: نوار install سرور را دست نزن؛ فقط حالت update مربوط به APK است */
      return;
    }
    renderApkStrip(!!show, Object.assign({ mode: 'update' }, opts));
    if (show) ensureNativeApkDownload(opts);
  }

  function syncUpdateNavFromStored() {
    const stored = readUpdateNav();
    applyUpdateNav(!!stored, stored || {});
  }

  function parseClientAppVersion() {
    const ua = navigator.userAgent || '';
    const m = ua.match(/VinorApp\/(?:Android|WebViewOnly)\/([0-9]+(?:\.[0-9]+)*)/i);
    return m ? m[1] : '';
  }

  function versionParts(v) {
    return String(v || '').split('.').map(function (p) {
      const d = (p || '').replace(/\D/g, '');
      return d ? parseInt(d, 10) : 0;
    });
  }

  function isServerApkNewer(serverV, clientV) {
    if (!serverV || !clientV) return false;
    const a = versionParts(clientV);
    const b = versionParts(serverV);
    const n = Math.max(a.length, b.length);
    for (let i = 0; i < n; i++) {
      const x = a[i] || 0;
      const y = b[i] || 0;
      if (x < y) return true;
      if (x > y) return false;
    }
    return false;
  }

  async function refreshUpdateNavFromServer() {
    if (!isVinorApkClient()) return;
    if (window.VinorNativeAppUpdate && typeof window.VinorNativeAppUpdate.refresh === 'function') {
      try { window.VinorNativeAppUpdate.refresh(); } catch (_) {}
      return;
    }
    const clientV = parseClientAppVersion();
    if (!clientV) {
      removeInstallApkStrip();
      persistUpdateNav(null);
      applyUpdateNav(false);
      return;
    }
    const headers = {
      Accept: 'application/json',
      'Cache-Control': 'no-cache',
      'X-Requested-With': 'XMLHttpRequest',
      'X-Vinor-App-Version': clientV
    };
    for (let i = 0; i < APP_VERSION_URLS.length; i++) {
      try {
        const res = await fetch(APP_VERSION_URLS[i], { headers: headers, credentials: 'same-origin', cache: 'no-store' });
        if (!res || !res.ok) continue;
        const d = await res.json();
        if (!d || d.success !== true) continue;
        const v = String(d.android_apk_version || '').trim();
        const url = String(d.android_apk_url || '').trim();
        if (v && url && isServerApkNewer(v, clientV)) {
          const state = { show: true, version: v, url: url };
          persistUpdateNav(state);
          applyUpdateNav(true, state);
          return;
        }
        removeInstallApkStrip();
        persistUpdateNav(null);
        applyUpdateNav(false);
        return;
      } catch (_) {}
    }
  }

  function reconcileApkStripOnBoot() {
    if (!isVinorApkClient()) return;

    removeInstallApkStrip();

    const clientV = parseClientAppVersion();
    const serverV = String(serverApkVersion || '').trim();
    const url = String(serverApkUrl || '').trim();
    if (!clientV || !serverV || !url) return;

    if (isServerApkNewer(serverV, clientV)) {
      const state = { show: true, version: serverV, url: url };
      persistUpdateNav(state);
      applyUpdateNav(true, state);
      return;
    }

    renderApkStrip(false);
    persistUpdateNav(null);
    applyUpdateNav(false);
  }

  window.__vinorSyncApkStrip = function () {
    if (!isVinorApkClient()) return;
    reconcileApkStripOnBoot();
    refreshUpdateNavFromServer();
  };

  window.__vinorSyncBottomNavBadges = syncAllNavBadges;
  window.vinorClearBottomNavMenuCache = function () {};

  window.addEventListener('vinor:app-update:nav', function (ev) {
    try {
      const d = (ev && ev.detail) || {};
      if (d.show) {
        persistUpdateNav(d);
        applyUpdateNav(true, d);
      } else {
        persistUpdateNav(null);
        applyUpdateNav(false);
      }
    } catch (_) {}
  });

  window.addEventListener('vinor:app-update:download', function (ev) {
    try {
      applyApkDownloadUi((ev && ev.detail) || {});
    } catch (_) {}
  });

  document.addEventListener('click', function (e) {
    const strip = e.target.closest && e.target.closest('[data-apk-strip]');
    if (!strip || strip.getAttribute('data-apk-strip-mode') !== 'update') return;
    if (!isVinorApkClient()) return;
    e.preventDefault();
    e.stopPropagation();
    triggerApkUpdateInstall();
  }, true);

  window.addEventListener('vinor:notifications:update', function (ev) {
    try {
      const u = ev && ev.detail && typeof ev.detail.unread !== 'undefined' ? ev.detail.unread : null;
      if (u !== null) setNavBadge('notifications', u);
    } catch (_) {}
  });

  window.addEventListener('vinor-favs-changed', function () {
    syncFavoritesBadge();
  });

  document.addEventListener('vinor-favs-changed', function () {
    syncFavoritesBadge();
  });

  if (serverShowAppUpdate) {
    persistUpdateNav({ show: true, version: serverApkVersion, url: serverApkUrl });
    applyUpdateNav(true, { version: serverApkVersion, url: serverApkUrl });
  } else if (isVinorApkClient()) {
    reconcileApkStripOnBoot();
    syncUpdateNavFromStored();
    try {
      if (window.VinorNativeAppUpdate && typeof window.VinorNativeAppUpdate.getCachedState === 'function') {
        var nativeRaw = window.VinorNativeAppUpdate.getCachedState();
        var nativeState = nativeRaw ? JSON.parse(nativeRaw) : null;
        if (nativeState && nativeState.show) {
          persistUpdateNav(nativeState);
          applyUpdateNav(true, nativeState);
        }
      }
    } catch (_) {}
    syncNativeDownloadUi();
  }

  /* اگر سرور بنر گذاشته، در mount درست (بالای کامپوزر یا پایین صفحه) نگه/بازیابی کن */
  (function ensureInstallStripInMount() {
    if (isVinorApkClient()) return;
    if (apkStripDismissedThisEntry()) return;
    if (!serverShowApkStrip || !serverApkUrl) return;
    var mount = getApkStripMount();
    if (!mount) return;
    var strip = getApkStripEl();
    if (!strip) {
      renderApkStrip(true, {
        mode: serverApkStripMode || 'install',
        url: serverApkUrl,
        version: serverApkVersion

      return;
    }
    if (strip.parentNode !== mount) mount.appendChild(strip);
    setApkBannerClass(true);
  })();

  window.addEventListener('vinor:express-page-swap', function () {
    try {
      if (typeof window.__vinorSyncApkStrip === 'function') window.__vinorSyncApkStrip();
      bindExistingApkStripSwipe();
      if (!isVinorApkClient()) {
        var mount = getApkStripMount();
        var strip = getApkStripEl();
        if (mount && strip && strip.parentNode !== mount) mount.appendChild(strip);
      }
    } catch (_) {}
  });

  bindExistingApkStripSwipe();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      bindExistingApkStripSwipe();
      syncAllNavBadges();
      if (isVinorApkClient()) window.__vinorSyncApkStrip();
    });
  } else {
    bindExistingApkStripSwipe();
    syncAllNavBadges();
    if (isVinorApkClient()) window.__vinorSyncApkStrip();
  }

})();
