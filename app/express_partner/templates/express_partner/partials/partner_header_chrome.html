{# همگام‌سازی --vn-partner-header-pad با ارتفاع واقعی هدر fixed #}
<script>
(function () {
  'use strict';
  if (window.__vinorPartnerHeaderChromeInit) return;
  window.__vinorPartnerHeaderChromeInit = true;

  var ro = null;
  var observed = null;

  function swapRoot() {
    return document.getElementById('vinor-express-page-swap');
  }

  function pageHeaders() {
    var root = swapRoot();
    var list = root
      ? root.querySelectorAll('header.ep-partner-header')
      : document.querySelectorAll('header.ep-partner-header');
    return Array.prototype.slice.call(list || []);
  }

  function purgeDuplicateHeaders() {
    var headers = pageHeaders();
    if (headers.length <= 1) return headers[0] || null;
    for (var i = 0; i < headers.length - 1; i++) {
      try { headers[i].remove(); } catch (_) {}
    }
    return headers[headers.length - 1];
  }

  function activeHeader() {
    return purgeDuplicateHeaders();
  }

  function offlineBarHeight() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    if (!bar || bar.hidden) return 0;
    var h = Math.ceil(bar.getBoundingClientRect().height);
    return h > 0 ? h : 28;
  }

  function syncPartnerHeaderPad() {
    var header = activeHeader();
    if (!header) {
      try { document.documentElement.style.removeProperty('--vn-partner-header-pad'); } catch (_) {}
      if (typeof window.__vinorExpressOfflineBarLayout === 'function') {
        window.__vinorExpressOfflineBarLayout();
      }
      return;
    }
    if (typeof window.__vinorExpressOfflineBarLayout === 'function') {
      window.__vinorExpressOfflineBarLayout();
    }
    var offlineH = offlineBarHeight();
    var h = Math.ceil(header.getBoundingClientRect().height + 8 + offlineH);
    if (h < 48) h = 56 + offlineH;
    document.documentElement.style.setProperty('--vn-partner-header-pad', h + 'px');
  }

  function bindHeader(header) {
    if (!header || header === observed) return;
    observed = header;
    syncPartnerHeaderPad();
    try {
      if (window.ResizeObserver) {
        if (ro) ro.disconnect();
        ro = new ResizeObserver(syncPartnerHeaderPad);
        ro.observe(header);
      }
    } catch (_) {}
  }

  function setup() {
    observed = null;
    bindHeader(activeHeader());
    syncPartnerHeaderPad();
  }

  function scheduleSetup() {
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(setup);
    });
  }

  window.__vinorPartnerHeaderPadSync = syncPartnerHeaderPad;
  window.__vinorPartnerHeaderChromeSetup = scheduleSetup;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleSetup);
  } else {
    scheduleSetup();
  }
  window.addEventListener('resize', syncPartnerHeaderPad, { passive: true });
  window.addEventListener('vinor:express-page-swap', scheduleSetup);
})();
</script>
