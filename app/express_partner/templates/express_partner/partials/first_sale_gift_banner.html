{# بنر هدیه اولین فروش — همکار تأییدشده که هنوز فروش تأییدشده ندارد #}
{% if is_approved|default(false) and (sold_count|default(0) == 0) %}
<section class="vinor-first-sale-banner w-full mb-3 max-sm:mb-2 lg:mb-4" aria-label="هدیه اولین فروش">
  <div class="relative overflow-hidden rounded-2xl border border-amber-500/30 bg-gradient-to-br from-amber-600 via-amber-700 to-orange-950 p-3.5 shadow-lg shadow-amber-950/25 max-sm:p-3 sm:p-4">
    <div class="pointer-events-none absolute -left-8 -top-10 h-28 w-28 rounded-full bg-white/10 blur-2xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -bottom-10 -right-6 h-28 w-28 rounded-full bg-emerald-400/15 blur-2xl" aria-hidden="true"></div>

    <div class="relative flex items-start gap-3 sm:items-center sm:gap-4">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/20 bg-white/10 text-xl text-amber-100 shadow-inner sm:h-12 sm:w-12">
        <i class="fas fa-gift" aria-hidden="true"></i>
      </div>
      <div class="min-w-0 flex-1">
        <span class="inline-flex items-center gap-1 rounded-full border border-white/20 bg-white/10 px-2 py-0.5 text-[10px] font-semibold text-amber-50">
          <i class="fas fa-star text-[8px] text-yellow-200" aria-hidden="true"></i>
          هدیه ویژه همکار
        </span>
        <p class="mt-1.5 text-[14px] font-extrabold leading-snug text-white sm:text-[15px]">
          ۱۰ میلیون تومان هدیه اولین فروش
        </p>
        <p class="mt-1 text-[11px] leading-relaxed text-amber-50/90 sm:text-xs">
          علاوه بر پورسانت همین فایل، با اولین فروش تأییدشده ۱۰ میلیون تومان هدیه می‌گیرید.
        </p>
      </div>
    </div>
  </div>
</section>
{% endif %}
