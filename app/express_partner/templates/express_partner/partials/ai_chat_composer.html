{# کامپوزر Vinor AI — سبک ChatGPT (پیل + پلاس + ارسال با تایپ) #}
{% set chat_mode = chat_mode|default('home-layer') %}
<style id="vinor-ai-composer-gpt">
  .ai-composer--gpt {
    --gpt-shell: #2f2f2f;
    --gpt-shell-hover: #3a3a3a;
    --gpt-text: #ececec;
    --gpt-muted: #8f8f8f;
    --gpt-icon: #ececec;
    --gpt-send: #ffffff;
    --gpt-send-fg: #0d0d0d;
  }
  .ai-composer--gpt .ai-composer__inner {
    display: block;
    width: 100%;
    max-width: 42rem;
    margin-inline: auto;
  }

  /* پیشنهادها — کیبورد جواب تلگرام (ردیف ادغام‌شده) */
  .ai-composer--gpt .ai-composer__suggestions {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 0.4rem;
    margin: 0 0 0.55rem;
    padding: 0;
    max-width: 100%;
    background: transparent;
  }
  .ai-composer--gpt .ai-composer__suggestions[hidden] {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__chip {
    display: inline-flex;
    flex: 1 1 calc(50% - 0.2rem);
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 0;
    min-width: calc(50% - 0.2rem);
    max-width: 100%;
    margin: 0;
    padding: 0.62rem 0.7rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0.7rem;
    background: #1e2c3a;
    color: #fff;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0;
    white-space: nowrap;
    text-align: center;
    text-decoration: none;
    box-shadow: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
  }
  /* تک‌دکمه یا فرد آخر → تمام‌عرض مثل تلگرام */
  .ai-composer--gpt .ai-composer__suggestions[data-chip-count="1"] .ai-composer__chip,
  .ai-composer--gpt .ai-composer__chip:last-child:nth-child(odd) {
    flex: 1 1 100%;
    min-width: 100%;
  }
  a.ai-composer__chip { color: #fff; }
  .ai-composer--gpt .ai-composer__chip:hover {
    background: #253648;
    border-color: rgba(255, 255, 255, 0.12);
  }
  .ai-composer--gpt .ai-composer__chip:active {
    background: #2b4054;
    transform: scale(0.985);
  }
  .ai-composer--gpt .ai-composer__chip-icon {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__chip-label {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  /* پیل ورودی */
  .ai-composer--gpt .ai-composer__shell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    width: 100%;
    min-height: 3.35rem;
    padding: 0.4rem 0.45rem 0.4rem 0.4rem;
    border-radius: 9999px;
    border: 0;
    background: var(--gpt-shell);
    box-shadow: none;
    transition: background-color 0.18s ease;
  }
  .ai-composer--gpt .ai-composer__shell-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    width: 100%;
    min-width: 0;
  }
  .ai-composer--gpt .ai-composer__shell:focus-within {
    background: var(--gpt-shell-hover);
    box-shadow: none;
    border-color: transparent;
  }

  /* راهنمای تایپی — یک خط؛ با جا شدن از عرض، ابتدای متن بیرون می‌رود */
  .ai-composer--gpt .ai-composer__type-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    pointer-events: none;
    z-index: 2;
    box-sizing: border-box;
  }
  .ai-composer--gpt .ai-composer__type-hint[hidden] {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__type-hint-clip {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    direction: ltr;
    text-align: left;
  }
  .ai-composer--gpt .ai-composer__type-hint-text {
    display: inline-block;
    white-space: nowrap;
    color: var(--gpt-muted);
    font-size: 1.0625rem;
    line-height: 1.45;
    vertical-align: middle;
    will-change: transform;
    unicode-bidi: plaintext;
  }
  .ai-composer--gpt.ai-composer--ready .ai-composer__type-hint {
    display: none !important;
  }

  .ai-composer--gpt .ai-composer__plus,
  .ai-composer--gpt .ai-composer__send {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--gpt-icon);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ai-composer--gpt .ai-composer__plus {
    width: 2.35rem;
    height: 2.35rem;
    border-radius: 9999px;
  }
  .ai-composer--gpt .ai-composer__plus:active {
    opacity: 0.7;
  }

  .ai-composer--gpt .ai-composer__input {
    position: relative;
    z-index: 3;
    flex: 1;
    min-width: 0;
    min-height: 1.55rem;
    max-height: 9.5rem;
    resize: none;
    border: 0 !important;
    border-radius: 0;
    background: transparent !important;
    color: var(--gpt-text);
    font-size: 1.0625rem;
    line-height: 1.45;
    padding: 0.55rem 0.15rem;
    outline: none;
    box-shadow: none !important;
  }
  .ai-composer--gpt .ai-composer__input::placeholder {
    color: var(--gpt-muted);
  }

  .ai-composer--gpt .ai-composer__send {
    display: inline-flex;
    width: 2.35rem;
    height: 2.35rem;
    border-radius: 9999px;
    background: var(--gpt-send);
    color: var(--gpt-send-fg);
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .ai-composer--gpt .ai-composer__send[aria-disabled="true"] {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }
  .ai-composer--gpt .ai-composer__send:not([aria-disabled="true"]):active {
    transform: scale(0.94);
  }
  .ai-composer--gpt .ai-composer__send:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .ai-composer--gpt .ai-composer__send-icon { display: block; }

  .ai-composer--gpt.ai-composer--readonly .ai-composer__shell { opacity: 0.55; }
</style>
<form id="aiChatForm" class="ai-composer ai-composer--gpt" method="post" action="#" autocomplete="off" novalidate
      data-vinor-chat-surface="partner"
      data-mode="{{ chat_mode }}"
      data-chat-url="{{ chat_api_url }}"
      data-history-url="{{ history_api_url }}"
      data-clear-url="{{ clear_api_url }}"
      data-switch-url="{{ switch_thread_url }}"
      data-delete-url="{{ delete_thread_url }}"
      data-sync-url="{{ sync_api_url }}"
      data-agent-confirm-url="{{ agent_confirm_url|default('') }}"
      data-agent-cancel-url="{{ agent_cancel_url|default('') }}"
      data-postchi-thread-id="{{ postchi_thread_id|default('__postchi__') }}"
      data-postchi-messages-url="{{ postchi_messages_url|default('') }}"
      data-postchi-send-url="{{ postchi_send_url|default('') }}"
      data-postchi-open-url="{{ postchi_open_url|default('') }}"
      data-lawyer-thread-id="{{ lawyer_thread_id|default('__lawyer__') }}"
      data-lawyer-enabled="{{ '1' if (lawyer_enabled|default(false) and me_phone) else '0' }}"
      {% if guest_replies_remaining is not none %}data-guest-replies-remaining="{{ guest_replies_remaining }}"{% endif %}
      {% if guest_replies_limit is not none %}data-guest-replies-limit="{{ guest_replies_limit }}"{% endif %}>
  {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
  <input type="hidden" id="aiActiveThreadId" value="{{ active_thread_id or '' }}">
  <div class="ai-composer__inner">
    <div class="ai-composer__shell">
      <div class="ai-composer__shell-row">
        <button type="button" class="ai-composer__plus" id="aiComposerPlus" aria-label="افزودن" tabindex="-1">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
          </svg>
        </button>
        <label for="aiInput" class="sr-only">پیام</label>
        <div class="ai-composer__type-hint" data-ai-type-hint hidden aria-hidden="true">
          <div class="ai-composer__type-hint-clip">
            <span class="ai-composer__type-hint-text" data-ai-type-hint-text></span>
          </div>
        </div>
        <textarea id="aiInput" name="message" rows="1"
                  placeholder=""
                  class="ai-composer__input"
                  enterkeyhint="send"></textarea>
        <button type="submit" id="aiSendBtn" class="ai-composer__send" aria-label="ارسال" disabled>
          <svg class="ai-composer__send-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M11 20V7.83l-5.3 5.3-1.4-1.42L12 4l7.7 7.71-1.4 1.42L13 7.83V20h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</form>
{% if chat_mode == 'home-inline' %}
<script>
(function () {
  /* fallback تا قبل از لود ai-chat.js؛ بعد از لود، __vinorFireHomeQuickPrompt اولویت دارد */
  if (window.__vinorAiQuickBound) return;
  window.__vinorAiQuickBound = true;
  document.addEventListener('click', function (ev) {
    var chip = ev.target && ev.target.closest ? ev.target.closest('[data-ai-quick-prompt]') : null;
    if (!chip) return;
    if (chip.getAttribute('data-vn-quick-handled') === '1') return;
    var page = document.getElementById('homeDashboardPage');
    if (!page || !page.contains(chip)) return;
    var prompt = (chip.getAttribute('data-ai-quick-prompt') || '').trim();
    if (!prompt) return;
    ev.preventDefault();
    ev.stopPropagation();
    var intent = chip.getAttribute('data-ai-intent') || '';
    if (typeof window.__vinorFireHomeQuickPrompt === 'function') {
      try {
        chip.setAttribute('data-vn-quick-handled', '1');
      } catch (_) {}
      window.__vinorFireHomeQuickPrompt(prompt, intent, chip);
      return;
    }
    var form = document.getElementById('aiChatForm');
    var input = document.getElementById('aiInput');
    var btn = document.getElementById('aiSendBtn');
    if (!form) return;
    try {
      if (input) {
        input.disabled = false;
        input.removeAttribute('aria-disabled');
        input.value = prompt;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if (btn) {
        btn.disabled = false;
        btn.setAttribute('aria-disabled', 'false');
      }
      if (intent) form.setAttribute('data-pending-intent', intent);
      else form.removeAttribute('data-pending-intent');
      form.removeAttribute('data-silent-user');
      form.removeAttribute('data-silent-message');
    } catch (_) {}
    try {
      if (typeof form.requestSubmit === 'function') form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    } catch (_) {
      try {
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      } catch (__) {}
    }
  });
})();
</script>
{% endif %}
