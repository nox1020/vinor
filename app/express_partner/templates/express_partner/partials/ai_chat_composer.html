{# کامپوزر Vinor AI — سبک ChatGPT (پیل + پلاس + ارسال با تایپ) #}
{% set chat_mode = chat_mode|default('home-layer') %}
<style id="vinor-ai-composer-gpt">
  .ai-composer--gpt {
    --gpt-shell: #2f2f2f;
    --gpt-shell-hover: #3a3a3a;
    --gpt-text: #ececec;
    --gpt-muted: #8f8f8f;
    --gpt-icon: #ececec;
    --gpt-send: #ffffff;
    --gpt-send-fg: #0d0d0d;
  }
  .ai-composer--gpt .ai-composer__inner {
    display: block;
    width: 100%;
    max-width: 42rem;
    margin-inline: auto;
  }

  /* پیشنهادها — کیبورد جواب تلگرام (ردیف ادغام‌شده) */
  .ai-composer--gpt .ai-composer__suggestions {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 0.4rem;
    margin: 0 0 0.55rem;
    padding: 0;
    max-width: 100%;
    background: transparent;
  }
  .ai-composer--gpt .ai-composer__suggestions[hidden] {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__chip {
    display: inline-flex;
    flex: 1 1 calc(50% - 0.2rem);
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 0;
    min-width: calc(50% - 0.2rem);
    max-width: 100%;
    margin: 0;
    padding: 0.62rem 0.7rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0.7rem;
    background: #1e2c3a;
    color: #fff;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0;
    white-space: nowrap;
    text-align: center;
    text-decoration: none;
    box-shadow: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
  }
  /* تک‌دکمه یا فرد آخر → تمام‌عرض مثل تلگرام */
  .ai-composer--gpt .ai-composer__suggestions[data-chip-count="1"] .ai-composer__chip,
  .ai-composer--gpt .ai-composer__chip:last-child:nth-child(odd) {
    flex: 1 1 100%;
    min-width: 100%;
  }
  a.ai-composer__chip { color: #fff; }
  .ai-composer--gpt .ai-composer__chip:hover {
    background: #253648;
    border-color: rgba(255, 255, 255, 0.12);
  }
  .ai-composer--gpt .ai-composer__chip:active {
    background: #2b4054;
    transform: scale(0.985);
  }
  .ai-composer--gpt .ai-composer__chip-icon {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__chip-label {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  /* پیل ورودی */
  .ai-composer--gpt .ai-composer__shell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    width: 100%;
    min-height: 3.35rem;
    padding: 0.4rem 0.45rem 0.4rem 0.4rem;
    border-radius: 9999px;
    border: 0;
    background: var(--gpt-shell);
    box-shadow: none;
    transition: background-color 0.18s ease;
  }
  .ai-composer--gpt .ai-composer__shell-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    width: 100%;
    min-width: 0;
  }
  .ai-composer--gpt .ai-composer__shell:focus-within {
    background: var(--gpt-shell-hover);
    box-shadow: none;
    border-color: transparent;
  }

  /* راهنمای تایپی — یک خط؛ با جا شدن از عرض، ابتدای متن بیرون می‌رود */
  .ai-composer--gpt .ai-composer__type-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    pointer-events: none;
    z-index: 2;
    box-sizing: border-box;
  }
  .ai-composer--gpt .ai-composer__type-hint[hidden] {
    display: none !important;
  }
  .ai-composer--gpt .ai-composer__type-hint-clip {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    direction: ltr;
    text-align: left;
  }
  .ai-composer--gpt .ai-composer__type-hint-text {
    display: inline-block;
    white-space: nowrap;
    color: var(--gpt-muted);
    font-size: 1.0625rem;
    line-height: 1.45;
    vertical-align: middle;
    will-change: transform;
    unicode-bidi: plaintext;
  }
  .ai-composer--gpt.ai-composer--ready .ai-composer__type-hint {
    display: none !important;
  }

  .ai-composer--gpt .ai-composer__plus,
  .ai-composer--gpt .ai-composer__send {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--gpt-icon);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ai-composer--gpt .ai-composer__plus {
    width: 2.35rem;
    height: 2.35rem;
    border-radius: 9999px;
  }
  .ai-composer--gpt .ai-composer__plus:active {
    opacity: 0.7;
  }

  .ai-composer--gpt .ai-composer__input {
    position: relative;
    z-index: 3;
    flex: 1;
    min-width: 0;
    min-height: 1.55rem;
    max-height: 9.5rem;
    resize: none;
    border: 0 !important;
    border-radius: 0;
    background: transparent !important;
    color: var(--gpt-text);
    /* 16px: جلوگیری از زوم خودکار iOS روی فوکوس */
    font-size: 16px;
    line-height: 1.4;
    padding: 0.55rem 0.15rem;
    outline: none;
    box-shadow: none !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  .ai-composer--gpt .ai-composer__input::placeholder {
    color: var(--gpt-muted);
    opacity: 1;
  }

  .ai-composer--gpt .ai-composer__send {
    display: inline-flex;
    width: 2.35rem;
    height: 2.35rem;
    border-radius: 9999px;
    background: var(--gpt-send);
    color: var(--gpt-send-fg);
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .ai-composer--gpt .ai-composer__send[aria-disabled="true"] {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }
  .ai-composer--gpt .ai-composer__send:not([aria-disabled="true"]):active {
    transform: scale(0.94);
  }
  .ai-composer--gpt .ai-composer__send:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .ai-composer--gpt .ai-composer__send-icon { display: block; }

  .ai-composer--gpt.ai-composer--readonly .ai-composer__shell { opacity: 0.55; }

  /* —— منوی پیوست به سبک تلگرام (موبایل‌محور) —— */
  .ai-composer--gpt .ai-attach {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 0.28rem);
    z-index: 80;
    isolation: isolate;
    pointer-events: none;
  }
  .ai-composer--gpt .ai-attach.is-open {
    pointer-events: auto;
  }
  .ai-composer--gpt .ai-attach__sheet {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: space-evenly;
    gap: 0.15rem;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 0.7rem 0.5rem 0.65rem;
    margin: 0;
    border-radius: 1.15rem;
    background-color: #2c2c2e;
    background-image: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(0, 0, 0, 0.3);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    transform: translateY(6px);
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.2, 1), visibility 0.14s;
    direction: rtl;
    isolation: isolate;
  }
  .ai-composer--gpt .ai-attach.is-open .ai-attach__sheet {
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
  }
  .ai-composer--gpt .ai-attach__btn {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    min-width: 0;
    max-width: 6.5rem;
    min-height: 4.15rem;
    padding: 0.15rem 0.2rem;
    margin: 0;
    border: 0;
    border-radius: 0.85rem;
    background: transparent;
    color: #ececec;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .ai-composer--gpt .ai-attach__btn:focus,
  .ai-composer--gpt .ai-attach__btn:focus-visible {
    outline: none;
    box-shadow: none;
  }
  .ai-composer--gpt .ai-attach__btn:active {
    background: transparent;
  }
  .ai-composer--gpt .ai-attach__btn:active .ai-attach__icon {
    transform: scale(0.92);
  }
  .ai-composer--gpt .ai-attach__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 3.4rem;
    height: 3.4rem;
    border-radius: 9999px;
    color: #fff;
    background-clip: padding-box;
    box-shadow: none;
    transition: transform 0.12s ease;
    pointer-events: none;
  }
  .ai-composer--gpt .ai-attach__icon--gallery { background-color: #5b8def; }
  .ai-composer--gpt .ai-attach__icon--camera { background-color: #54a3ff; }
  .ai-composer--gpt .ai-attach__icon--video { background-color: #a855f7; }
  .ai-composer--gpt .ai-attach__icon--file { background-color: #6b7280; }
  .ai-composer--gpt .ai-attach__label {
    display: block;
    width: 100%;
    font-size: 0.7rem;
    font-weight: 500;
    color: #c4c4c4;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .ai-composer--gpt .ai-composer__plus.is-open {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
  }
  .ai-composer--gpt .ai-composer__plus.is-open svg {
    transform: rotate(45deg);
  }
  .ai-composer--gpt .ai-composer__plus svg {
    transition: transform 0.2s ease;
  }

  @media (max-width: 420px) {
    .ai-composer--gpt .ai-attach__icon {
      width: 3.2rem;
      height: 3.2rem;
    }
    .ai-composer--gpt .ai-attach__label {
      font-size: 0.66rem;
    }
    .ai-composer--gpt .ai-attach__sheet {
      padding: 0.65rem 0.35rem 0.6rem;
      border-radius: 1.05rem;
    }
    .ai-composer--gpt .ai-attach__btn {
      min-height: 4rem;
      max-width: none;
    }
  }

  /* پیش‌نمایش پیوست قبل از ارسال */
  .ai-composer--gpt .ai-attach-preview {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: 0 0 0.45rem;
    padding: 0.45rem 0.55rem;
    border-radius: 0.95rem;
    background: #2a2a2a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    direction: rtl;
  }
  .ai-composer--gpt .ai-attach-preview[hidden] {
    display: none !important;
  }
  .ai-composer--gpt .ai-attach-preview__thumb {
    flex-shrink: 0;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.55rem;
    overflow: hidden;
    background: #1a1a1a;
    display: grid;
    place-items: center;
    color: #a1a1aa;
  }
  .ai-composer--gpt .ai-attach-preview__thumb img,
  .ai-composer--gpt .ai-attach-preview__thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .ai-composer--gpt .ai-attach-preview__meta {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ai-composer--gpt .ai-attach-preview__name {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #f4f4f5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ai-composer--gpt .ai-attach-preview__sub {
    display: block;
    margin-top: 0.12rem;
    font-size: 0.68rem;
    color: #a1a1aa;
  }
  .ai-composer--gpt .ai-attach-preview__remove {
    flex-shrink: 0;
    width: 1.85rem;
    height: 1.85rem;
    border: 0;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.08);
    color: #e4e4e7;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .ai-composer--gpt .ai-attach-preview.is-uploading {
    opacity: 0.75;
  }
  .ai-composer--gpt .ai-attach-preview__bar {
    display: block;
    height: 2px;
    margin-top: 0.35rem;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  .ai-composer--gpt .ai-attach-preview__bar > span {
    display: block;
    height: 100%;
    width: 0%;
    background: #5b8def;
    transition: width 0.15s ease;
  }

  /* حباب پیوست در چت */
  .ai-msg-attach {
    display: block;
    max-width: min(16.5rem, 78vw);
    margin: 0 0 0.35rem;
    border-radius: 0.85rem;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .ai-msg-attach__media {
    display: block;
    width: 100%;
    max-height: 14rem;
    object-fit: cover;
    background: #111;
  }
  .ai-msg-attach__file {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.65rem 0.75rem;
    color: inherit;
    text-decoration: none;
  }
  .ai-msg-attach__file-icon {
    flex-shrink: 0;
    width: 2.35rem;
    height: 2.35rem;
    border-radius: 0.55rem;
    background: rgba(255, 255, 255, 0.1);
    display: grid;
    place-items: center;
  }
  .ai-msg-attach__file-name {
    font-size: 0.82rem;
    font-weight: 600;
    word-break: break-word;
  }
  .ai-msg-attach__file-sub {
    margin-top: 0.1rem;
    font-size: 0.68rem;
    opacity: 0.7;
  }
</style>
<form id="aiChatForm" class="ai-composer ai-composer--gpt" method="post" action="#" autocomplete="off" novalidate
      data-vinor-chat-surface="partner"
      data-mode="{{ chat_mode }}"
      data-chat-url="{{ chat_api_url }}"
      data-history-url="{{ history_api_url }}"
      data-clear-url="{{ clear_api_url }}"
      data-switch-url="{{ switch_thread_url }}"
      data-delete-url="{{ delete_thread_url }}"
      data-sync-url="{{ sync_api_url }}"
      data-agent-confirm-url="{{ agent_confirm_url|default('') }}"
      data-agent-cancel-url="{{ agent_cancel_url|default('') }}"
      data-upload-url="{{ ai_upload_url|default('') }}"
      data-postchi-thread-id="{{ postchi_thread_id|default('__postchi__') }}"
      data-postchi-messages-url="{{ postchi_messages_url|default('') }}"
      data-postchi-send-url="{{ postchi_send_url|default('') }}"
      data-postchi-open-url="{{ postchi_open_url|default('') }}"
      data-lawyer-thread-id="{{ lawyer_thread_id|default('__lawyer__') }}"
      data-lawyer-enabled="{{ '1' if (lawyer_enabled|default(false) and me_phone) else '0' }}"
      {% if guest_replies_remaining is not none %}data-guest-replies-remaining="{{ guest_replies_remaining }}"{% endif %}
      {% if guest_replies_limit is not none %}data-guest-replies-limit="{{ guest_replies_limit }}"{% endif %}>
  {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
  <input type="hidden" id="aiActiveThreadId" value="{{ active_thread_id or '' }}">
  <input type="file" id="aiAttachInputGallery" class="sr-only" accept="image/*" tabindex="-1" aria-hidden="true">
  <input type="file" id="aiAttachInputCamera" class="sr-only" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input type="file" id="aiAttachInputVideo" class="sr-only" accept="video/*" tabindex="-1" aria-hidden="true">
  <input type="file" id="aiAttachInputFile" class="sr-only" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.png,.jpg,.jpeg,.webp" tabindex="-1" aria-hidden="true">
  <div class="ai-composer__inner" style="position:relative">
    <div class="ai-attach" id="aiAttachPanel" hidden>
      <div class="ai-attach__sheet" role="menu" aria-label="افزودن پیوست">
        <button type="button" class="ai-attach__btn" role="menuitem" data-ai-attach="gallery">
          <span class="ai-attach__icon ai-attach__icon--gallery" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </span>
          <span class="ai-attach__label">گالری</span>
        </button>
        <button type="button" class="ai-attach__btn" role="menuitem" data-ai-attach="camera">
          <span class="ai-attach__icon ai-attach__icon--camera" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4V8z"/><circle cx="12" cy="13.5" r="3.2"/></svg>
          </span>
          <span class="ai-attach__label">دوربین</span>
        </button>
        <button type="button" class="ai-attach__btn" role="menuitem" data-ai-attach="video">
          <span class="ai-attach__icon ai-attach__icon--video" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-2.5v8l-5-2.5v-3z"/></svg>
          </span>
          <span class="ai-attach__label">ویدیو</span>
        </button>
        <button type="button" class="ai-attach__btn" role="menuitem" data-ai-attach="file">
          <span class="ai-attach__icon ai-attach__icon--file" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></svg>
          </span>
          <span class="ai-attach__label">فایل</span>
        </button>
      </div>
    </div>
    <div class="ai-attach-preview" id="aiAttachPreview" hidden>
      <div class="ai-attach-preview__thumb" data-ai-attach-thumb></div>
      <div class="ai-attach-preview__meta">
        <span class="ai-attach-preview__name" data-ai-attach-name></span>
        <span class="ai-attach-preview__sub" data-ai-attach-sub></span>
        <span class="ai-attach-preview__bar" hidden data-ai-attach-bar><span></span></span>
      </div>
      <button type="button" class="ai-attach-preview__remove" id="aiAttachPreviewRemove" aria-label="حذف پیوست">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </div>
    <div class="ai-composer__shell">
      <div class="ai-composer__shell-row">
        <button type="button" class="ai-composer__plus" id="aiComposerPlus" aria-label="افزودن" aria-expanded="false" aria-controls="aiAttachPanel">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
          </svg>
        </button>
        <label for="aiInput" class="sr-only">از وینور بپرس</label>
        <div class="ai-composer__type-hint" data-ai-type-hint hidden aria-hidden="true">
          <div class="ai-composer__type-hint-clip">
            <span class="ai-composer__type-hint-text" data-ai-type-hint-text></span>
          </div>
        </div>
        <textarea id="aiInput" name="message" rows="1"
                  placeholder="از وینور بپرس"
                  class="ai-composer__input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="sentences"
                  spellcheck="false"
                  enterkeyhint="send"
                  aria-label="از وینور بپرس"></textarea>
        <button type="submit" id="aiSendBtn" class="ai-composer__send" aria-label="ارسال" disabled>
          <svg class="ai-composer__send-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M11 20V7.83l-5.3 5.3-1.4-1.42L12 4l7.7 7.71-1.4 1.42L13 7.83V20h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</form>
{% if chat_mode == 'home-inline' %}
<script>
(function () {
  /* fallback تا قبل از لود ai-chat.js؛ بعد از لود، __vinorFireHomeQuickPrompt اولویت دارد */
  if (window.__vinorAiQuickBound) return;
  window.__vinorAiQuickBound = true;
  document.addEventListener('click', function (ev) {
    var chip = ev.target && ev.target.closest ? ev.target.closest('[data-ai-quick-prompt]') : null;
    if (!chip) return;
    if (chip.getAttribute('data-vn-quick-handled') === '1') return;
    var page = document.getElementById('homeDashboardPage');
    if (!page || !page.contains(chip)) return;
    var prompt = (chip.getAttribute('data-ai-quick-prompt') || '').trim();
    if (!prompt) return;
    ev.preventDefault();
    ev.stopPropagation();
    var intent = chip.getAttribute('data-ai-intent') || '';
    if (typeof window.__vinorFireHomeQuickPrompt === 'function') {
      try {
        chip.setAttribute('data-vn-quick-handled', '1');
      } catch (_) {}
      window.__vinorFireHomeQuickPrompt(prompt, intent, chip);
      return;
    }
    var form = document.getElementById('aiChatForm');
    var input = document.getElementById('aiInput');
    var btn = document.getElementById('aiSendBtn');
    if (!form) return;
    try {
      if (input) {
        input.disabled = false;
        input.removeAttribute('aria-disabled');
        input.value = prompt;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if (btn) {
        btn.disabled = false;
        btn.setAttribute('aria-disabled', 'false');
      }
      if (intent) form.setAttribute('data-pending-intent', intent);
      else form.removeAttribute('data-pending-intent');
      form.removeAttribute('data-silent-user');
      form.removeAttribute('data-silent-message');
    } catch (_) {}
    try {
      if (typeof form.requestSubmit === 'function') form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    } catch (_) {
      try {
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      } catch (__) {}
    }
  });
})();
</script>
{% endif %}
