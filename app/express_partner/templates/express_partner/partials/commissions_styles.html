{# کیف پول — سبک دیوار: تخت، لیست تمیز، CTA قرمز #}
<style>
  :root {
    --vn-wallet-red: #e22828;
    --vn-wallet-red-hover: #c91f1f;
    --vn-wallet-surface: #14161c;
    --vn-wallet-border: rgba(255, 255, 255, 0.07);
    --vn-wallet-muted: #8b919a;
    --vn-wallet-text: #f3f4f6;
  }

  .vn-wallet-card {
    background: var(--vn-wallet-surface);
    border: 1px solid var(--vn-wallet-border);
    border-radius: 0;
    overflow: hidden;
  }

  .vn-wallet-hero {
    padding: 1.25rem 1rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--vn-wallet-border);
  }
  .vn-wallet-hero__label {
    font-size: 0.8125rem;
    color: var(--vn-wallet-muted);
    margin-bottom: 0.35rem;
  }
  .vn-wallet-hero__balance {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.15;
    color: var(--vn-wallet-text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .vn-wallet-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-bottom: 1px solid var(--vn-wallet-border);
  }
  .vn-wallet-stat {
    padding: 0.75rem 0.5rem;
    text-align: center;
    border-inline-start: 1px solid var(--vn-wallet-border);
  }
  .vn-wallet-stat:first-child {
    border-inline-start: none;
  }
  .vn-wallet-stat__label {
    display: block;
    font-size: 0.6875rem;
    color: var(--vn-wallet-muted);
    line-height: 1.3;
    margin-bottom: 0.2rem;
  }
  .vn-wallet-stat__value {
    display: block;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--vn-wallet-text);
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }
  .vn-wallet-stat__value--amber {
    color: #fbbf24;
  }

  .vn-wallet-actions {
    padding: 0.85rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .vn-wallet-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    width: 100%;
    min-height: 2.75rem;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 700;
    text-decoration: none;
    transition: background-color 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .vn-wallet-btn--primary {
    background: var(--vn-wallet-red);
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .vn-wallet-btn--primary:hover:not(:disabled) {
    background: var(--vn-wallet-red-hover);
  }
  .vn-wallet-btn--primary:disabled,
  .vn-wallet-btn--primary[aria-disabled="true"] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .vn-wallet-btn--ghost {
    background: transparent;
    color: var(--vn-wallet-muted);
    border: 1px solid var(--vn-wallet-border);
  }
  .vn-wallet-btn--ghost:hover {
    background: rgba(255, 255, 255, 0.03);
    color: var(--vn-wallet-text);
  }

  .vn-wallet-note {
    margin-top: 0.25rem;
    font-size: 0.6875rem;
    color: var(--vn-wallet-muted);
    text-align: center;
    line-height: 1.45;
  }

  .vn-wallet-section {
    background: var(--vn-wallet-surface);
    border: 1px solid var(--vn-wallet-border);
    margin-top: 0.5rem;
  }
  .vn-wallet-section__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--vn-wallet-border);
  }
  .vn-wallet-section__title {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--vn-wallet-text);
  }
  .vn-wallet-section__link {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--vn-wallet-red);
    text-decoration: none;
  }
  .vn-wallet-section__link:hover {
    opacity: 0.9;
  }

  .vn-wallet-list {
    divide-color: var(--vn-wallet-border);
  }
  .vn-wallet-list > .commission-txn-row + .commission-txn-row {
    border-top: 1px solid var(--vn-wallet-border);
  }

  .vn-wallet-empty {
    padding: 2.5rem 1rem;
    text-align: center;
  }
  .vn-wallet-empty__icon {
    width: 3rem;
    height: 3rem;
    margin: 0 auto 0.75rem;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.04);
    display: grid;
    place-items: center;
    color: #6b7280;
    font-size: 1.125rem;
  }
  .vn-wallet-empty__text {
    font-size: 0.8125rem;
    color: var(--vn-wallet-muted);
  }

  .vn-wallet-promo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
    padding: 0.85rem 1rem;
    background: var(--vn-wallet-surface);
    border: 1px solid var(--vn-wallet-border);
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }
  .vn-wallet-promo:active {
    background: rgba(255, 255, 255, 0.03);
  }
  .vn-wallet-promo__icon {
    flex-shrink: 0;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.5rem;
    background: rgba(226, 40, 40, 0.12);
    color: var(--vn-wallet-red);
    display: grid;
    place-items: center;
    font-size: 1rem;
  }
  .vn-wallet-promo__title {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--vn-wallet-text);
  }
  .vn-wallet-promo__sub {
    font-size: 0.75rem;
    color: var(--vn-wallet-muted);
    margin-top: 0.1rem;
  }

  @keyframes vn-comm-wd-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(226, 40, 40, 0.45); }
    50% { opacity: 0.4; box-shadow: 0 0 0 4px rgba(226, 40, 40, 0); }
  }
  .vn-comm-wd-dot--live {
    animation: vn-comm-wd-pulse 1.35s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .vn-comm-wd-dot--live { animation: none; opacity: 1; }
  }

  .commission-txn-row {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    background: var(--vn-wallet-surface);
  }
  .commission-txn-row__icon {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: none;
    color: #9ca3af;
    font-size: 0.8rem;
    line-height: 1;
  }
  .commission-txn-row__icon--credit {
    color: #4ade80;
    background: rgba(74, 222, 128, 0.1);
  }
  .commission-txn-row__icon--debit {
    color: #f87171;
    background: rgba(248, 113, 113, 0.1);
  }
  .commission-txn-row__icon--pending {
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.1);
  }
  .commission-txn-row__title {
    color: var(--vn-wallet-text) !important;
    font-weight: 600 !important;
    font-size: 0.875rem !important;
  }
  .commission-txn-row__amount {
    font-size: 0.875rem !important;
    font-weight: 700 !important;
  }
  .commission-txn-row__meta {
    color: var(--vn-wallet-muted) !important;
    font-size: 0.75rem !important;
  }
  .commission-txn-row__date {
    color: #6b7280 !important;
  }
  .commission-txn-row__status {
    font-size: 0.6875rem;
    color: var(--vn-wallet-muted);
  }

  .comm-txn-income-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    background: var(--vn-wallet-surface);
    border-bottom: 1px solid var(--vn-wallet-border);
  }
  .comm-txn-income-strip > div {
    padding: 0.85rem 1rem;
    border-inline-start: 1px solid var(--vn-wallet-border);
  }
  .comm-txn-income-strip > div:first-child {
    border-inline-start: none;
  }

  .comm-income-row:active {
    background-color: rgba(255, 255, 255, 0.03);
  }

  .vn-wallet-sheet {
    background: var(--vn-wallet-surface);
  }
</style>
