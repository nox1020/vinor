<style>
  #partnerRequestsPage {
    --req-red: #e22828;
    --req-muted: #8b919a;
    --req-text: #f3f4f6;
    --req-border: rgba(255, 255, 255, 0.08);
    --req-surface: rgba(255, 255, 255, 0.03);
  }

  .req-summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.4rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--req-border);
  }
  @media (min-width: 640px) {
    .req-summary { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
  .req-summary-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    padding: 0.55rem 0.25rem;
    border-radius: 0.625rem;
    border: 1px solid var(--req-border);
    background: var(--req-surface);
    text-decoration: none;
    color: inherit;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .req-summary-card:active { background: rgba(255, 255, 255, 0.05); }
  .req-summary-card.is-active {
    border-color: rgba(226, 40, 40, 0.45);
    background: rgba(226, 40, 40, 0.1);
  }
  .req-summary-card__count {
    font-size: 1.125rem;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .req-summary-card__label {
    font-size: 0.625rem;
    font-weight: 600;
    color: var(--req-muted);
    line-height: 1.3;
  }
  .req-summary-card--action .req-summary-card__count { color: #f87171; }
  .req-summary-card--progress .req-summary-card__count { color: #fbbf24; }
  .req-summary-card--done .req-summary-card__count { color: #34d399; }
  .req-summary-card--cancel .req-summary-card__count { color: #a1a1aa; }

  .req-flash {
    padding: 0.55rem 1rem;
    border-bottom: 1px solid rgba(52, 211, 153, 0.15);
    background: rgba(16, 185, 129, 0.08);
    font-size: 0.75rem;
    font-weight: 600;
    color: #a7f3d0;
  }
  @media (min-width: 640px) {
    .req-flash { padding-left: 1.5rem; padding-right: 1.5rem; }
  }

  .req-list-label {
    margin: 0;
    padding: 0.65rem 1rem 0.35rem;
    font-size: 0.6875rem;
    font-weight: 700;
    color: var(--req-muted);
  }
  @media (min-width: 640px) {
    .req-list-label { padding-left: 1.5rem; padding-right: 1.5rem; }
  }

  .req-list { border-bottom: 1px solid var(--req-border); }

  .req-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--req-border);
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  @media (min-width: 640px) {
    .req-card { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
  .req-card:last-child { border-bottom: none; }
  .req-card:active { background: rgba(255, 255, 255, 0.03); }
  .req-card--urgent {
    background: linear-gradient(90deg, rgba(226, 40, 40, 0.08), transparent 72%);
  }

  .req-card__main { flex: 1; min-width: 0; text-align: right; }
  .req-card__title {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1.35;
    color: var(--req-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .req-card__next {
    margin: 0.25rem 0 0;
    font-size: 0.8125rem;
    font-weight: 700;
    line-height: 1.4;
    color: #fde68a;
  }
  .req-card--urgent .req-card__next { color: #fecaca; }
  .req-card--completed .req-card__next,
  .req-card--cancelled .req-card__next {
    color: var(--req-muted);
    font-weight: 600;
  }
  .req-card__meta {
    margin: 0.2rem 0 0;
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--req-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .req-card__chev {
    flex-shrink: 0;
    font-size: 0.625rem;
    color: #52525b;
  }

  .req-empty {
    padding: 2.5rem 1.5rem;
    text-align: center;
  }
  .req-empty__title {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 800;
    color: var(--req-text);
  }
  .req-empty__text {
    margin: 0.4rem 0 0;
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--req-muted);
  }
  .req-empty__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 1rem;
    min-height: 2.5rem;
    padding: 0 1.1rem;
    border-radius: 0.5rem;
    background: var(--req-red);
    color: #fff;
    font-size: 0.8125rem;
    font-weight: 700;
    text-decoration: none;
  }
</style>
