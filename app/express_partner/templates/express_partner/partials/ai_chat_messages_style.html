{# استایل پیام‌های چت — چیدمان GPT #}
<style id="vinor-ai-messages-gpt">
  #aiMessages.ai-messages {
    --gpt-msg-max: 48rem;
    --gpt-user-bg: #2f2f2f;
    --gpt-text: #ececec;
    --gpt-muted: #8e8e8e;
    --gpt-avatar-bg: #0d0d0d;
    --gpt-avatar-border: rgba(255, 255, 255, 0.14);
    display: flex;
    flex-direction: column;
    gap: 1.35rem;
    width: 100%;
    padding: 1rem 1rem 1.5rem;
  }
  #aiMessages .ai-msg-wrap {
    display: flex;
    width: 100%;
    max-width: var(--gpt-msg-max);
    margin-inline: auto;
    flex-direction: column;
  }
  #aiMessages .ai-msg-row {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    width: 100%;
  }
  #aiMessages .ai-msg-wrap--user .ai-msg-row {
    justify-content: flex-end;
  }
  #aiMessages .ai-msg-wrap--assistant .ai-msg-row {
    justify-content: flex-start;
  }
  #aiMessages .ai-msg-avatar {
    flex-shrink: 0;
    width: 1.75rem;
    height: 1.75rem;
    margin-top: 0.15rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    border: 1px solid var(--gpt-avatar-border);
    background: var(--gpt-avatar-bg);
    color: #f4f4f4;
  }
  #aiMessages .ai-msg-body {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    min-width: 0;
    flex: 1 1 auto;
  }
  #aiMessages .ai-msg-wrap--user .ai-msg-body {
    flex: 0 1 auto;
    max-width: min(85%, 32rem);
    align-items: flex-end;
  }
  #aiMessages .ai-msg-bubble {
    font-size: 0.975rem;
    line-height: 1.7;
    color: var(--gpt-text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #aiMessages .ai-msg-wrap[data-streaming="1"] .ai-msg-bubble::after {
    content: '';
    display: inline-block;
    width: 0.42em;
    height: 1em;
    margin-inline-start: 0.1em;
    vertical-align: -0.08em;
    border-radius: 1px;
    background: currentColor;
    opacity: 0.8;
    animation: aiStreamCaret 0.85s steps(1) infinite;
  }
  @keyframes aiStreamCaret {
    0%, 49% { opacity: 0.85; }
    50%, 100% { opacity: 0; }
  }
  #aiMessages .ai-msg-wrap--user .ai-msg-bubble {
    background: var(--gpt-user-bg);
    border-radius: 1.5rem;
    padding: 0.7rem 1.05rem;
    border: 0;
  }
  #aiMessages .ai-msg-wrap--assistant .ai-msg-bubble {
    background: transparent;
    border-radius: 0;
    padding: 0.2rem 0;
    border: 0;
  }
  #aiMessages .ai-msg-wrap[data-welcome="1"] .ai-msg-bubble {
    color: var(--gpt-text);
  }
  #aiMessages .ai-msg-wrap[data-admin-reply="1"] .ai-msg-bubble {
    background: rgba(245, 158, 11, 0.12);
    color: #fffbeb;
    border-radius: 1.1rem;
    padding: 0.7rem 1rem;
  }
  #aiMessages .ai-msg-wrap[data-postchi="1"] .ai-msg-bubble {
    background: rgba(16, 185, 129, 0.12);
    color: #d1fae5;
    border-radius: 1.1rem;
    padding: 0.7rem 1rem;
  }
  #aiMessages .ai-msg-cards {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }
  /* کارت فایل هرگز داخل چت دیده نشود — فقط نوار بالای خانه */
  #aiMessages .ai-land-cards {
    display: none !important;
  }
  #aiMessages .ai-msg-thinking {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 1.5rem;
    padding: 0.35rem 0;
  }
  #aiMessages .ai-msg-dot {
    width: 0.4rem;
    height: 0.4rem;
    border-radius: 9999px;
    background: #b4b4b4;
    animation: aiMsgDotPulse 1.2s ease-in-out infinite;
  }
  #aiMessages .ai-msg-dot:nth-child(2) { animation-delay: 0.15s; }
  #aiMessages .ai-msg-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes aiMsgDotPulse {
    0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  #aiMessages .ai-msg-wrap[data-pending-user="1"] .ai-msg-bubble {
    opacity: 0.88;
  }

  /* بلاک کپی GPT-style — موبایل‌محور */
  #aiMessages .ai-copy-blocks {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    width: 100%;
    max-width: 100%;
    margin-top: 0.35rem;
    min-width: 0;
  }
  #aiMessages .ai-msg-cards .ai-copy-blocks {
    margin-top: 0;
  }
  #aiMessages .ai-copy-block {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    border-radius: 0.85rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: #0d0d0d;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #aiMessages .ai-copy-block__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    min-height: 2.35rem;
    padding: 0.35rem 0.45rem 0.35rem 0.75rem;
    background: #2f2f2f;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  #aiMessages .ai-copy-block__label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0;
    color: #ececec;
    line-height: 1.2;
  }
  #aiMessages .ai-copy-block__btn {
    flex: 0 0 auto;
    width: 2.1rem;
    height: 2.1rem;
    min-width: 2.1rem;
    min-height: 2.1rem;
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 0.55rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: #c4c4c4;
    cursor: pointer;
    touch-action: manipulation;
  }
  #aiMessages .ai-copy-block__btn svg {
    width: 1.05rem;
    height: 1.05rem;
    display: block;
    pointer-events: none;
  }
  #aiMessages .ai-copy-block__btn:hover,
  #aiMessages .ai-copy-block__btn:active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  #aiMessages .ai-copy-block__btn.is-copied {
    color: #86efac;
    background: rgba(34, 197, 94, 0.12);
  }
  #aiMessages .ai-copy-block__icon-check { display: none; }
  #aiMessages .ai-copy-block__btn.is-copied .ai-copy-block__icon-copy { display: none; }
  #aiMessages .ai-copy-block__btn.is-copied .ai-copy-block__icon-check { display: block; }
  #aiMessages .ai-copy-block__pre {
    margin: 0;
    padding: 0.7rem 0.8rem 0.85rem;
    max-height: min(40vh, 14rem);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8125rem;
    line-height: 1.55;
    color: #ececec;
    background: transparent;
    direction: rtl;
    text-align: right;
  }
  #aiMessages .ai-msg-bubble .ai-copy-blocks {
    margin-top: 0.55rem;
  }
  #aiMessages .ai-msg-prose {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* نوار اکشن زیر جواب — شبیه GPT */
  #aiMessages .ai-msg-actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.15rem;
    margin-top: 0.15rem;
    direction: ltr;
    justify-content: flex-start;
  }
  #aiMessages .ai-msg-wrap--user .ai-msg-actions {
    display: none;
  }
  #aiMessages .ai-msg-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.85rem;
    height: 1.85rem;
    padding: 0;
    border: 0;
    border-radius: 0.45rem;
    background: transparent;
    color: #b4b4b4;
    cursor: pointer;
    position: relative;
  }
  #aiMessages .ai-msg-action:hover,
  #aiMessages .ai-msg-action:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    color: #ececec;
    outline: none;
  }
  #aiMessages .ai-msg-action:active {
    background: rgba(255, 255, 255, 0.12);
  }
  #aiMessages .ai-msg-action svg {
    width: 1.05rem;
    height: 1.05rem;
    display: block;
  }
  #aiMessages .ai-msg-action.is-active {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }
  #aiMessages .ai-msg-action.is-ok {
    color: #86efac;
  }
  #aiMessages .ai-msg-action-wrap {
    position: relative;
    display: inline-flex;
  }
  #aiMessages .ai-msg-action-menu {
    position: absolute;
    bottom: calc(100% + 0.35rem);
    left: 0;
    min-width: 9.5rem;
    padding: 0.3rem;
    border-radius: 0.65rem;
    background: #2f2f2f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    z-index: 20;
    display: none;
    direction: rtl;
    text-align: right;
  }
  #aiMessages .ai-msg-action-menu.is-open {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  #aiMessages .ai-msg-action-menu button {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: #ececec;
    font-size: 0.78rem;
    font-weight: 500;
    text-align: right;
    padding: 0.45rem 0.55rem;
    border-radius: 0.45rem;
    cursor: pointer;
  }
  #aiMessages .ai-msg-action-menu button:hover {
    background: rgba(255, 255, 255, 0.08);
  }
</style>
