{# نوار آفلاین زیر هدر — مشابه تلگرام #}
<div id="vinorExpressOfflineBar" class="vinor-express-offline-bar" hidden role="status" aria-live="polite">
  <div class="vinor-express-offline-bar__inner">
    <svg id="vinorExpressOfflineBarIconOffline" class="vinor-express-offline-bar__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2.5 8.5a15.5 15.5 0 0 1 19 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M5.5 12.2a10.5 10.5 0 0 1 13 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8.8 15.8a5.5 5.5 0 0 1 6.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg id="vinorExpressOfflineBarIconOnline" class="vinor-express-offline-bar__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
      <path d="M2.5 8.5a15.5 15.5 0 0 1 19 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M5.5 12.2a10.5 10.5 0 0 1 13 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8.8 15.8a5.5 5.5 0 0 1 6.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span id="vinorExpressOfflineBarText">آفلاین هستید</span>
  </div>
</div>

<script>
(function () {
  'use strict';
  if (window.__vinorExpressConnectivityInit) return;
  window.__vinorExpressConnectivityInit = true;

  var OFFLINE_MSG = 'آفلاین هستید';
  var ONLINE_MSG = 'آنلاین شدید';
  var ONLINE_TOAST_MS = 2200;
  var ONLINE_GRACE_MS = 3500;
  var lastOnline = null;
  var onlineToastActive = false;
  var onlineHideTimer = null;
  var onlineGraceUntil = 0;
  var BAR_FALLBACK_H = 28;
  var reachabilityPending = false;
  var lastReachabilityAt = 0;
  var REACHABILITY_COOLDOWN_MS = 4000;
  var REACHABILITY_INTERVAL_MS = 20000;
  var reachabilityTimer = null;
  var layoutScrollRaf = 0;
  var unreachableStreak = 0;

  function inOnlineGrace() {
    return Date.now() < onlineGraceUntil;
  }

  function markOnlineGrace() {
    onlineGraceUntil = Date.now() + ONLINE_GRACE_MS;
  }

  function isHeaderPinned(header) {
    if (!header) return false;
    if (header.classList.contains('ep-partner-header--sticky')) return true;
    if (header.classList.contains('fixed')) return true;
    try {
      var pos = window.getComputedStyle(header).position;
      return pos === 'fixed' || pos === 'sticky';
    } catch (_) {
      return false;
    }
  }

  function findActiveHeader() {
    try {
      var swap = document.getElementById('vinor-express-page-swap');
      var list = swap
        ? swap.querySelectorAll('header.ep-partner-header')
        : document.querySelectorAll('header.ep-partner-header');
      if (!list || !list.length) return null;
      for (var i = list.length - 1; i >= 0; i--) {
        var h = list[i];
        if (h.getBoundingClientRect().height > 0) return h;
      }
      return list[list.length - 1];
    } catch (_) {
      return null;
    }
  }

  function layoutOfflineBar() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    if (!bar || bar.hidden) return;
    var topPx = 0;
    var header = findActiveHeader();
    if (header) {
      try {
        var rect = header.getBoundingClientRect();
        if (isHeaderPinned(header) || rect.top <= 1) {
          topPx = Math.max(0, Math.round(rect.bottom));
        }
      } catch (_) {}
    }
    bar.style.top = topPx > 0 ? topPx + 'px' : 'env(safe-area-inset-top, 0px)';
    var h = Math.ceil(bar.getBoundingClientRect().height) || BAR_FALLBACK_H;
    try { document.documentElement.style.setProperty('--vn-partner-offline-bar-h', h + 'px'); } catch (_) {}
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
  }

  function scheduleLayoutOfflineBar() {
    if (layoutScrollRaf) return;
    layoutScrollRaf = window.requestAnimationFrame(function () {
      layoutScrollRaf = 0;
      layoutOfflineBar();
    });
  }

  window.__vinorExpressOfflineBarLayout = layoutOfflineBar;

  function clearOnlineHideTimer() {
    if (onlineHideTimer) {
      window.clearTimeout(onlineHideTimer);
      onlineHideTimer = null;
    }
  }

  function syncBarIcons(mode) {
    var offIcon = document.getElementById('vinorExpressOfflineBarIconOffline');
    var onIcon = document.getElementById('vinorExpressOfflineBarIconOnline');
    if (offIcon) offIcon.hidden = mode !== 'offline';
    if (onIcon) onIcon.hidden = mode !== 'online';
  }

  function hideBar() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    var root = document.documentElement;
    if (!bar) return;
    onlineToastActive = false;
    bar.hidden = true;
    bar.classList.remove('vinor-express-offline-bar--online');
    bar.classList.remove('vinor-express-offline-bar--offline');
    root.classList.remove('vinor-express-offline');
    try { root.style.removeProperty('--vn-partner-offline-bar-h'); } catch (_) {}
    try { bar.style.removeProperty('top'); } catch (_) {}
    syncBarIcons('none');
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
  }

  function showOfflineBar(message) {
    clearOnlineHideTimer();
    onlineToastActive = false;
    onlineGraceUntil = 0;
    var bar = document.getElementById('vinorExpressOfflineBar');
    var txt = document.getElementById('vinorExpressOfflineBarText');
    var root = document.documentElement;
    if (!bar) return;
    bar.hidden = false;
    bar.classList.remove('vinor-express-offline-bar--online');
    bar.classList.add('vinor-express-offline-bar--offline');
    if (txt) txt.textContent = message || OFFLINE_MSG;
    root.classList.add('vinor-express-offline');
    syncBarIcons('offline');
    layoutOfflineBar();
    if (!reachabilityTimer) {
      reachabilityTimer = window.setInterval(function () {
        applyConnectivity();
      }, REACHABILITY_INTERVAL_MS);
    }
  }

  function showOnlineToast(message) {
    clearOnlineHideTimer();
    onlineToastActive = true;
    markOnlineGrace();
    unreachableStreak = 0;
    var bar = document.getElementById('vinorExpressOfflineBar');
    var txt = document.getElementById('vinorExpressOfflineBarText');
    var root = document.documentElement;
    if (!bar) return;
    if (reachabilityTimer) {
      window.clearInterval(reachabilityTimer);
      reachabilityTimer = null;
    }
    bar.hidden = false;
    bar.classList.remove('vinor-express-offline-bar--offline');
    bar.classList.add('vinor-express-offline-bar--online');
    if (txt) txt.textContent = message || ONLINE_MSG;
    root.classList.remove('vinor-express-offline');
    syncBarIcons('online');
    layoutOfflineBar();
    onlineHideTimer = window.setTimeout(function () {
      onlineHideTimer = null;
      hideBar();
    }, ONLINE_TOAST_MS);
  }

  window.vinorExpressSyncConnectivity = function (online, opts) {
    opts = opts || {};
    var on = !!online;
    var prev = lastOnline;
    var nativeSource = opts.source === 'native';

    if (prev === on && !opts.force && !opts.onlineToast) return;

    if (on) {
      unreachableStreak = 0;
      var showToast = !!opts.onlineToast || prev === false;
      if (showToast) {
        lastOnline = true;
        showOnlineToast(opts.message);
        return;
      }
      if (onlineToastActive) {
        lastOnline = true;
        return;
      }
      lastOnline = true;
      clearOnlineHideTimer();
      hideBar();
      if (reachabilityTimer) {
        window.clearInterval(reachabilityTimer);
        reachabilityTimer = null;
      }
      return;
    }

    if ((inOnlineGrace() || onlineToastActive) && probeNativeOnline() && !nativeSource) {
      return;
    }

    lastOnline = false;
    showOfflineBar(opts.message);
  };

  function probeNativeOnline() {
    try {
      if (window.VinorConnectivity && typeof window.VinorConnectivity.isOnline === 'function') {
        return !!window.VinorConnectivity.isOnline();
      }
    } catch (_) {}
    return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
  }

  function probeReachability() {
    if (!probeNativeOnline()) return Promise.resolve(false);
    var now = Date.now();
    if (reachabilityPending) {
      return Promise.resolve(lastOnline !== false);
    }
    if (now - lastReachabilityAt < REACHABILITY_COOLDOWN_MS) {
      return Promise.resolve(lastOnline !== false);
    }
    reachabilityPending = true;
    var ctrl = null;
    try { ctrl = new AbortController(); } catch (_) {}
    var timer = ctrl ? window.setTimeout(function () { try { ctrl.abort(); } catch (_) {} }, 6000) : null;
    return fetch('/healthz', {
      cache: 'no-store',
      credentials: 'same-origin',
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (res) { return !!(res && (res.ok || res.status === 204)); })
      .catch(function () { return false; })
      .finally(function () {
        reachabilityPending = false;
        lastReachabilityAt = Date.now();
        if (timer) window.clearTimeout(timer);
      });
  }

  function applyConnectivity(opts) {
    opts = opts || {};
    if (!probeNativeOnline()) {
      unreachableStreak = 0;
      window.vinorExpressSyncConnectivity(false, { force: true });
      return Promise.resolve(false);
    }
    return probeReachability().then(function (reachable) {
      if (reachable) {
        unreachableStreak = 0;
        var wasOffline = lastOnline === false;
        window.vinorExpressSyncConnectivity(true, {
          force: true,
          onlineToast: !!opts.onlineToast || wasOffline
        });
        return true;
      }

      unreachableStreak += 1;
      if (probeNativeOnline() && (inOnlineGrace() || onlineToastActive || unreachableStreak < 2)) {
        if (!reachabilityTimer) {
          reachabilityTimer = window.setInterval(function () {
            applyConnectivity();
          }, REACHABILITY_INTERVAL_MS);
        }
        window.setTimeout(function () { applyConnectivity(); }, 1500);
        return lastOnline !== false;
      }

      window.vinorExpressSyncConnectivity(false, { force: true });
      return false;
    });
  }
  window.vinorExpressProbeConnectivity = applyConnectivity;

  window.addEventListener('online', function () {
    applyConnectivity({ onlineToast: lastOnline === false });
  });
  window.addEventListener('offline', function () {
    unreachableStreak = 0;
    onlineGraceUntil = 0;
    window.vinorExpressSyncConnectivity(false, { force: true });
  });
  window.addEventListener('resize', scheduleLayoutOfflineBar, { passive: true });
  window.addEventListener('scroll', scheduleLayoutOfflineBar, { passive: true, capture: true });
  window.addEventListener('vinor:express-page-swap', function () {
    scheduleLayoutOfflineBar();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) applyConnectivity();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { applyConnectivity(); }, { once: true });
  } else {
    applyConnectivity();
  }
})();
</script>
