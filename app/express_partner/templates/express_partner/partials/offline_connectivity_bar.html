{# وضعیت اتصال فقط در عنوان هدر — نوار آنلاین/آفلاین نمایش داده نمی‌شود #}
<div id="vinorExpressOfflineBar" class="vinor-express-offline-bar" hidden aria-hidden="true" style="display:none !important">
  <div class="vinor-express-offline-bar__inner">
    <span id="vinorExpressOfflineBarText" hidden>اتصال اینترنت قطع است</span>
  </div>
</div>

<script>
(function () {
  'use strict';
  if (window.__vinorExpressConnectivityInit) return;
  window.__vinorExpressConnectivityInit = true;

  var OFFLINE_NETWORK_MSG = 'اتصال اینترنت قطع است';
  var OFFLINE_SERVER_MSG = 'ارتباط با سرور برقرار نیست';
  var ONLINE_MSG = 'آنلاین شدید';
  var BRAND_ONLINE = 'وینور';
  var BRAND_CONNECTING = 'در حال اتصال...';
  var ONLINE_TOAST_MS = 120;
  var ONLINE_FADE_MS = 280;
  var ONLINE_GRACE_MS = 3500;
  var STARTUP_GRACE_MS = 5000;
  var pageLoadAt = Date.now();
  var lastOnline = null;
  var onlineToastActive = false;
  var barDismissInFlight = false;
  var onlineGraceUntil = 0;
  var BAR_FALLBACK_H = 28;
  var reachabilityPending = false;
  var lastReachabilityAt = 0;
  var REACHABILITY_COOLDOWN_MS = 3000;
  var REACHABILITY_INTERVAL_MS = 20000;
  var ONLINE_MONITOR_MS = 60000;
  var HEALTHZ_TIMEOUT_MS = 8000;
  var UNREACHABLE_THRESHOLD = 3;
  var reachabilityTimer = null;
  var onlineMonitorTimer = null;
  var probeRetryTimer = null;
  var toastHideTimer = null;
  var dismissFinalizeTimer = null;
  var layoutScrollRaf = 0;
  var unreachableStreak = 0;

  function cancelProbeRetries() {
    if (probeRetryTimer) {
      window.clearTimeout(probeRetryTimer);
      probeRetryTimer = null;
    }
    if (reachabilityTimer) {
      window.clearInterval(reachabilityTimer);
      reachabilityTimer = null;
    }
  }

  function stopOnlineMonitor() {
    if (onlineMonitorTimer) {
      window.clearInterval(onlineMonitorTimer);
      onlineMonitorTimer = null;
    }
  }

  function startOnlineMonitor() {
    if (onlineMonitorTimer) return;
    onlineMonitorTimer = window.setInterval(function () {
      if (document.hidden || lastOnline === false || onlineToastActive) return;
      applyConnectivity({ silent: true });
    }, ONLINE_MONITOR_MS);
  }

  function clearToastTimers() {
    if (toastHideTimer) {
      window.clearTimeout(toastHideTimer);
      toastHideTimer = null;
    }
    if (dismissFinalizeTimer) {
      window.clearTimeout(dismissFinalizeTimer);
      dismissFinalizeTimer = null;
    }
  }

  function inStartupGrace() {
    return Date.now() - pageLoadAt < STARTUP_GRACE_MS;
  }

  function inOnlineGrace() {
    return Date.now() < onlineGraceUntil;
  }

  function markOnlineGrace() {
    onlineGraceUntil = Date.now() + ONLINE_GRACE_MS;
  }

  function isHeaderPinned(header) {
    if (!header) return false;
    if (header.classList.contains('ep-partner-header--sticky')) return true;
    if (header.classList.contains('fixed')) return true;
    try {
      var pos = window.getComputedStyle(header).position;
      return pos === 'fixed' || pos === 'sticky';
    } catch (_) {
      return false;
    }
  }

  function findActiveHeader() {
    try {
      var swap = document.getElementById('vinor-express-page-swap');
      var list = swap
        ? swap.querySelectorAll('header.ep-partner-header')
        : document.querySelectorAll('header.ep-partner-header');
      if (!list || !list.length) return null;
      for (var i = list.length - 1; i >= 0; i--) {
        var h = list[i];
        if (h.getBoundingClientRect().height > 0) return h;
      }
      return list[list.length - 1];
    } catch (_) {
      return null;
    }
  }

  function layoutOfflineBar() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    if (!bar || bar.hidden || barDismissInFlight) return;
    if (bar.classList.contains('vinor-express-offline-bar--leaving')) return;
    var topPx = 0;
    var header = findActiveHeader();
    if (header) {
      try {
        var rect = header.getBoundingClientRect();
        if (isHeaderPinned(header) || rect.top <= 1) {
          topPx = Math.max(0, Math.round(rect.bottom));
        }
      } catch (_) {}
    }
    bar.style.top = topPx > 0 ? topPx + 'px' : 'env(safe-area-inset-top, 0px)';
    var h = Math.ceil(bar.getBoundingClientRect().height) || BAR_FALLBACK_H;
    try { document.documentElement.style.setProperty('--vn-partner-offline-bar-h', h + 'px'); } catch (_) {}
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
  }

  function scheduleLayoutOfflineBar() {
    if (layoutScrollRaf) return;
    layoutScrollRaf = window.requestAnimationFrame(function () {
      layoutScrollRaf = 0;
      layoutOfflineBar();
    });
  }

  window.__vinorExpressOfflineBarLayout = layoutOfflineBar;

  function clearOnlineHideTimer() {
    clearToastTimers();
  }

  function detachDismissListener(bar) {
    if (!bar || !bar.__vinorDismissEnd) return;
    bar.removeEventListener('transitionend', bar.__vinorDismissEnd);
    bar.__vinorDismissEnd = null;
  }

  function prefersReducedMotion() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (_) {
      return false;
    }
  }

  function hideBarCompletely(animate) {
    /* نوار UI حذف شده؛ فقط برند هدر به‌روز می‌شود */
    finalizeHideBar();
  }

  function scheduleOnlineToastHide() {
    clearToastTimers();
    toastHideTimer = window.setTimeout(function () {
      toastHideTimer = null;
      hideBarCompletely(true);
    }, ONLINE_TOAST_MS);
  }

  function setBarLayoutHeight(hPx) {
    try {
      document.documentElement.style.setProperty('--vn-partner-offline-bar-h', Math.max(0, hPx) + 'px');
    } catch (_) {}
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
  }

  function markBarVisible(onRoot) {
    try {
      if (onRoot) document.documentElement.classList.add('vinor-express-offline-bar-visible');
      else document.documentElement.classList.remove('vinor-express-offline-bar-visible');
    } catch (_) {}
  }

  function syncHeaderBrand(online) {
    var on = !!online;
    var el = document.getElementById('epHeaderBrandText');
    var wrap = document.getElementById('epHeaderBrand');
    var label = on ? BRAND_ONLINE : BRAND_CONNECTING;
    if (el && el.textContent !== label) el.textContent = label;
    if (wrap) wrap.setAttribute('aria-label', label);
  }

  function keepBarHidden() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    if (!bar) return;
    bar.hidden = true;
    bar.classList.remove(
      'vinor-express-offline-bar--online',
      'vinor-express-offline-bar--offline',
      'vinor-express-offline-bar--leaving'
    );
    markBarVisible(false);
    try { document.documentElement.style.removeProperty('--vn-partner-offline-bar-h'); } catch (_) {}
    try { bar.style.removeProperty('top'); } catch (_) {}
    syncBarIcons('none');
  }

  function finalizeHideBar() {
    var bar = document.getElementById('vinorExpressOfflineBar');
    var root = document.documentElement;
    if (!bar) return;
    detachDismissListener(bar);
    barDismissInFlight = false;
    onlineToastActive = false;
    keepBarHidden();
    root.classList.remove('vinor-express-offline');
    syncHeaderBrand(true);
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
    if (lastOnline !== false) startOnlineMonitor();
  }

  function dismissBar(opts) {
    hideBarCompletely(opts && opts.animate !== false);
  }

  function hideBar(opts) {
    hideBarCompletely(opts && opts.animate === true);
  }

  function syncBarIcons(mode) {
    var offIcon = document.getElementById('vinorExpressOfflineBarIconOffline');
    var onIcon = document.getElementById('vinorExpressOfflineBarIconOnline');
    if (offIcon) offIcon.hidden = mode !== 'offline';
    if (onIcon) onIcon.hidden = mode !== 'online';
  }

  function showOfflineBar(message) {
    clearToastTimers();
    cancelProbeRetries();
    stopOnlineMonitor();
    barDismissInFlight = false;
    onlineToastActive = false;
    onlineGraceUntil = 0;
    var root = document.documentElement;
    keepBarHidden();
    root.classList.add('vinor-express-offline');
    syncHeaderBrand(false);
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
    if (!reachabilityTimer) {
      reachabilityTimer = window.setInterval(function () {
        applyConnectivity();
      }, REACHABILITY_INTERVAL_MS);
    }
  }

  function showOnlineToast(message) {
    clearToastTimers();
    cancelProbeRetries();
    barDismissInFlight = false;
    onlineToastActive = false;
    markOnlineGrace();
    unreachableStreak = 0;
    var root = document.documentElement;
    keepBarHidden();
    root.classList.remove('vinor-express-offline');
    syncHeaderBrand(true);
    if (typeof window.__vinorPartnerHeaderPadSync === 'function') {
      window.__vinorPartnerHeaderPadSync();
    }
    startOnlineMonitor();
  }

  window.vinorExpressSyncConnectivity = function (online, opts) {
    opts = opts || {};
    var on = !!online;
    var prev = lastOnline;
    var nativeSource = opts.source === 'native';

    if (prev === on && !opts.onlineToast && !opts.message) {
      if (!nativeSource || !opts.force) return;
      if (on && !onlineToastActive && lastOnline !== false) return;
    }

    if (on) {
      unreachableStreak = 0;
      var showToast = !!opts.onlineToast || (prev === false && !opts.silent);
      if (showToast) {
        lastOnline = true;
        showOnlineToast(opts.message);
        return;
      }
      if (onlineToastActive) {
        lastOnline = true;
        hideBarCompletely(false);
        return;
      }
      lastOnline = true;
      cancelProbeRetries();
      hideBarCompletely(false);
      startOnlineMonitor();
      return;
    }

    stopOnlineMonitor();

    if ((inOnlineGrace() || onlineToastActive) && probeNativeOnline() && !nativeSource) {
      return;
    }

    if (inStartupGrace() && !nativeSource && probeNativeOnline()) {
      return;
    }

    lastOnline = false;
    showOfflineBar(opts.message || (nativeSource ? OFFLINE_NETWORK_MSG : OFFLINE_SERVER_MSG));
  };

  function probeNativeOnline() {
    try {
      if (window.VinorConnectivity && typeof window.VinorConnectivity.isOnline === 'function') {
        return !!window.VinorConnectivity.isOnline();
      }
    } catch (_) {}
    return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
  }

  function probeReachability() {
    if (!probeNativeOnline()) return Promise.resolve(false);
    var now = Date.now();
    if (reachabilityPending) {
      return Promise.resolve(lastOnline !== false);
    }
    if (now - lastReachabilityAt < REACHABILITY_COOLDOWN_MS) {
      return Promise.resolve(lastOnline !== false);
    }
    reachabilityPending = true;
    var ctrl = null;
    try { ctrl = new AbortController(); } catch (_) {}
    var timer = ctrl ? window.setTimeout(function () { try { ctrl.abort(); } catch (_) {} }, HEALTHZ_TIMEOUT_MS) : null;
    return fetch('/healthz', {
      method: 'HEAD',
      cache: 'no-store',
      credentials: 'same-origin',
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (res) { return !!(res && (res.ok || res.status === 204)); })
      .catch(function () { return false; })
      .finally(function () {
        reachabilityPending = false;
        lastReachabilityAt = Date.now();
        if (timer) window.clearTimeout(timer);
      });
  }

  function applyConnectivity(opts) {
    opts = opts || {};
    if (!probeNativeOnline()) {
      unreachableStreak = 0;
      window.vinorExpressSyncConnectivity(false, {
        force: true,
        source: 'native',
        message: OFFLINE_NETWORK_MSG
      });
      return Promise.resolve(false);
    }
    return probeReachability().then(function (reachable) {
      if (reachable) {
        unreachableStreak = 0;
        cancelProbeRetries();
        var wasOffline = lastOnline === false;
        window.vinorExpressSyncConnectivity(true, {
          force: opts.force !== false,
          onlineToast: !!opts.onlineToast || wasOffline,
          silent: !!opts.silent
        });
        if (lastOnline !== false) startOnlineMonitor();
        return true;
      }

      unreachableStreak += 1;
      if (
        probeNativeOnline() &&
        (inOnlineGrace() || onlineToastActive || inStartupGrace() || unreachableStreak < UNREACHABLE_THRESHOLD)
      ) {
        if (!reachabilityTimer) {
          reachabilityTimer = window.setInterval(function () {
            applyConnectivity();
          }, REACHABILITY_INTERVAL_MS);
        }
        if (probeRetryTimer) window.clearTimeout(probeRetryTimer);
        probeRetryTimer = window.setTimeout(function () {
          probeRetryTimer = null;
          applyConnectivity();
        }, 1800);
        return lastOnline !== false;
      }

      window.vinorExpressSyncConnectivity(false, {
        force: true,
        message: OFFLINE_SERVER_MSG
      });
      return false;
    });
  }
  window.vinorExpressProbeConnectivity = applyConnectivity;

  window.addEventListener('online', function () {
    applyConnectivity({ onlineToast: lastOnline === false });
  });
  window.addEventListener('offline', function () {
    unreachableStreak = 0;
    onlineGraceUntil = 0;
    window.vinorExpressSyncConnectivity(false, {
      force: true,
      source: 'native',
      message: OFFLINE_NETWORK_MSG
    });
  });
  window.addEventListener('resize', scheduleLayoutOfflineBar, { passive: true });
  window.addEventListener('scroll', scheduleLayoutOfflineBar, { passive: true, capture: true });
  window.addEventListener('vinor:express-page-swap', function () {
    scheduleLayoutOfflineBar();
    syncHeaderBrand(lastOnline !== false);
    if (!onlineToastActive) applyConnectivity({ silent: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopOnlineMonitor();
      cancelProbeRetries();
      return;
    }
    if (!onlineToastActive) applyConnectivity();
    else if (lastOnline !== false) startOnlineMonitor();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      syncHeaderBrand(probeNativeOnline());
      applyConnectivity({ silent: true });
    }, { once: true });
  } else {
    syncHeaderBrand(probeNativeOnline());
    applyConnectivity({ silent: true });
  }
})();
</script>
