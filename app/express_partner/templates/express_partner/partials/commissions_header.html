{# هدر کیف پول — فقط دکمهٔ برگشت شناور؛ بدون عنوان وسط؛ کارت از بالای صفحه #}
{% from 'express_partner/partials/partner_header.html' import ep_back_link %}

<header id="commissionsPageHeader"
        data-tour="commissions-header"
        class="ep-partner-header ep-partner-header--shell-none"
        aria-label="بازگشت">
  <div class="comm-float-back">
    {{ ep_back_link(url_for('express_partner.home'), class='vinor-dash-glass-pill comm-header-glass-btn') }}
  </div>
</header>
<style>
  #commissionsPageHeader.ep-partner-header {
    height: 0;
    padding: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 90;
  }
  #commissionsPageHeader .comm-float-back {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 0.45rem);
    right: calc(env(safe-area-inset-right, 0px) + 0.7rem);
    left: auto;
    z-index: 90;
    pointer-events: none;
  }
  #commissionsPageHeader .comm-float-back a,
  #commissionsPageHeader .comm-float-back .ep-partner-header-btn {
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* فضای دکمهٔ برگشت روی گوشهٔ کارت اول */
  #commissionsRefreshMount .vn-wallet-stack > .vn-wallet-card:first-of-type .vn-wallet-hero {
    padding-inline-end: 3.15rem;
  }
</style>
