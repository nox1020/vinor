<script>
  (function () {
    if (window.__vinorCommTxnDetailAbort) {
      try { window.__vinorCommTxnDetailAbort.abort(); } catch (_) {}
    }
    window.__vinorCommTxnDetailAbort = new AbortController();
    var signal = window.__vinorCommTxnDetailAbort.signal;

    var currentDetail = null;
    var txnDetailsCache = null;

    function ensureModal() {
      if (typeof window.hoistVinorExpressBodyModals === 'function') {
        try { window.hoistVinorExpressBodyModals(); } catch (_) {}
      }
      return document.getElementById('vnTxnDetailModal');
    }

    function syncOverlay(open) {
      var ov = window.vinorExpressModalOverlay;
      if (ov) {
        if (open) ov.open();
        else ov.close();
        return;
      }
      document.documentElement.classList.toggle('vinor-express-overlay-modal-open', !!open);
      try { document.body.style.overflow = open ? 'hidden' : ''; } catch (_) {}
    }

    function loadTxnDetailsCache() {
      if (txnDetailsCache) return txnDetailsCache;
      var node = document.getElementById('vnTxnDetailsJson');
      if (!node) {
        txnDetailsCache = [];
        return txnDetailsCache;
      }
      try {
        txnDetailsCache = JSON.parse(node.textContent || '[]');
      } catch (_) {
        txnDetailsCache = [];
      }
      return txnDetailsCache;
    }

    function toFaDigits(s) {
      var p = '۰۱۲۳۴۵۶۷۸۹';
      return String(s || '').replace(/[0-9]/g, function (d) { return p[parseInt(d, 10)]; });
    }

    function formatToman(n) {
      var v = Math.max(0, parseInt(String(n || '0'), 10) || 0);
      if (v === 0) return '۰ تومان';
      var raw = String(v);
      var rev = raw.split('').reverse().join('');
      var parts = [];
      for (var i = 0; i < rev.length; i += 3) {
        parts.push(rev.slice(i, i + 3));
      }
      var joined = parts.join('،').split('').reverse().join('');
      return toFaDigits(joined) + ' تومان';
    }

    function fmtDate(dt) {
      try {
        var d = new Date(String(dt || '').replace(' ', 'T'));
        if (isNaN(d.getTime())) return String(dt || '—');
        return d.toLocaleDateString('fa-IR', {
          timeZone: 'Asia/Tehran',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (_) {
        return String(dt || '—');
      }
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function statusClass(d) {
      var t = d.txn_type || '';
      var st = d.status || '';
      if (t === 'withdrawal') return 'bg-violet-500/20 text-violet-200 border-violet-500/30';
      if (t === 'withdrawal_request') {
        if (st === 'cancelled') return 'bg-slate-500/20 text-slate-300 border-slate-500/30';
        if (st === 'rejected') return 'bg-red-500/20 text-red-300 border-red-500/30';
        if (st === 'approved' || st === 'processing') return 'bg-sky-500/20 text-sky-200 border-sky-500/30';
        return 'bg-amber-500/20 text-amber-200 border-amber-500/35';
      }
      if (st === 'paid') return 'bg-white/[0.06] text-zinc-300 border-white/[0.1]';
      if (st === 'approved') return 'bg-[#4ade80]/15 text-[#4ade80] border-[#4ade80]/25';
      if (st === 'rejected') return 'bg-red-500/20 text-red-300 border-red-500/30';
      return 'bg-amber-500/15 text-amber-200 border-amber-500/30';
    }

    function amountClass(d) {
      var sign = d.amount_sign || '+';
      if (sign === '-') return 'text-[#f87171]';
      return 'text-[#4ade80]';
    }

    function iconForDetail(d) {
      var t = d.txn_type || '';
      if (t === 'withdrawal') return { cls: 'fa-check', wrap: 'bg-white/[0.05] text-zinc-400' };
      if (t === 'withdrawal_request') return { cls: 'fa-arrow-down', wrap: 'bg-[#e22828]/12 text-[#f87171]' };
      if ((d.description || '').indexOf('دعوت') >= 0) return { cls: 'fa-user-plus', wrap: 'bg-[#4ade80]/12 text-[#4ade80]' };
      return { cls: 'fa-home', wrap: 'bg-[#4ade80]/12 text-[#4ade80]' };
    }

    function renderRows(container, items, valueFormatter, rowClass) {
      if (!container) return;
      if (!items || !items.length) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }
      container.classList.remove('hidden');
      var cls = rowClass || 'flex items-start justify-between gap-3 px-3.5 py-2.5 text-xs';
      container.innerHTML = items.map(function (item) {
        var val = valueFormatter ? valueFormatter(item) : escHtml(item.value);
        return (
          '<div class="' + cls + '">' +
          '<span class="text-slate-500 shrink-0">' + escHtml(item.label) + '</span>' +
          '<span class="text-slate-200 font-medium text-end break-all">' + val + '</span>' +
          '</div>'
        );
      }).join('');
    }

    function renderWallet(d) {
      var elWallet = document.getElementById('vnTxnDetailWallet');
      var elWalletBody = document.getElementById('vnTxnDetailWalletBody');
      var elWalletTitle = document.getElementById('vnTxnDetailWalletTitle');
      if (!elWallet || !elWalletBody) return;
      var items = d.wallet_fields || [];
      if (!items.length) {
        elWallet.classList.add('hidden');
        elWalletBody.innerHTML = '';
        return;
      }
      if (elWalletTitle) {
        elWalletTitle.textContent = d.wallet_title || 'حساب بانکی / کیف پول';
      }
      elWallet.classList.remove('hidden');
      renderRows(elWalletBody, items, function (item) {
        if (item.format === 'toman') return escHtml(formatToman(item.value));
        return escHtml(item.value);
      }, 'flex items-start justify-between gap-3 px-3.5 py-2.5 text-[11px]');
    }

    function openDetail(d) {
      var modal = ensureModal();
      if (!d || !modal) return;

      var elTitle = document.getElementById('vnTxnDetailModalTitle');
      var elType = document.getElementById('vnTxnDetailType');
      var elAmount = document.getElementById('vnTxnDetailAmount');
      var elStatus = document.getElementById('vnTxnDetailStatus');
      var elDesc = document.getElementById('vnTxnDetailDesc');
      var elIconWrap = document.getElementById('vnTxnDetailIconWrap');
      var elIcon = document.getElementById('vnTxnDetailIcon');
      var elDates = document.getElementById('vnTxnDetailDates');
      var elFields = document.getElementById('vnTxnDetailFields');
      var elActions = document.getElementById('vnTxnDetailActions');
      var elCancelBtn = document.getElementById('vnTxnDetailCancelBtn');

      currentDetail = d;
      if (elTitle) elTitle.textContent = d.title || 'جزئیات تراکنش';
      if (elType) elType.textContent = d.title || '';
      if (elAmount) {
        elAmount.textContent = (d.amount_sign || '') + formatToman(d.amount || 0);
        elAmount.className = 'text-[1.65rem] font-extrabold tabular-nums tracking-tight leading-none ' + amountClass(d);
      }
      if (elStatus) {
        elStatus.textContent = d.status_label || '';
        elStatus.className = 'inline-flex px-2.5 py-1 rounded-md text-[10px] font-semibold border ' + statusClass(d);
      }
      if (elDesc) {
        elDesc.textContent = d.description || '';
        elDesc.classList.toggle('hidden', !(d.description || '').trim());
      }
      if (elIcon && elIconWrap) {
        var ic = iconForDetail(d);
        elIcon.className = 'fas ' + ic.cls + ' text-lg';
        elIconWrap.className = 'mx-auto w-12 h-12 rounded-full flex items-center justify-center ' + ic.wrap;
      }
      renderWallet(d);
      renderRows(elDates, d.dates || [], function (item) {
        return escHtml(fmtDate(item.value));
      });
      renderRows(elFields, d.fields || [], function (item) {
        if (item.format === 'toman') return escHtml(formatToman(item.value));
        return escHtml(item.value);
      });
      if (elActions && elCancelBtn) {
        var showCancel = !!(d.cancellable && d.withdrawal_id);
        elActions.classList.toggle('hidden', !showCancel);
        if (showCancel) {
          elCancelBtn.setAttribute('data-cancel-withdrawal', d.withdrawal_id);
        } else {
          elCancelBtn.removeAttribute('data-cancel-withdrawal');
        }
      }

      modal.classList.remove('hidden');
      modal.setAttribute('aria-hidden', 'false');
      try { void modal.offsetWidth; } catch (_) {}
      modal.classList.add('vn-txn-detail-modal--open');
      syncOverlay(true);
    }

    function closeDetail() {
      var modal = ensureModal();
      if (!modal) return;
      var wasOpen = modal.classList.contains('vn-txn-detail-modal--open');
      modal.classList.remove('vn-txn-detail-modal--open');
      window.setTimeout(function () {
        if (!modal.classList.contains('vn-txn-detail-modal--open')) {
          modal.classList.add('hidden');
        }
      }, 280);
      modal.setAttribute('aria-hidden', 'true');
      currentDetail = null;
      if (wasOpen) syncOverlay(false);
    }

    function detailFromRow(row) {
      if (!row) return null;
      var idxRaw = row.getAttribute('data-txn-idx');
      if (idxRaw === null || idxRaw === '') return null;
      var idx = parseInt(idxRaw, 10);
      if (isNaN(idx)) return null;
      var cache = loadTxnDetailsCache();
      var d = cache[idx];
      return d && typeof d === 'object' ? d : null;
    }

    window.__vinorOpenTxnDetail = openDetail;
    window.__vinorCloseTxnDetail = closeDetail;
    window.__vinorInvalidateTxnDetailsCache = function () { txnDetailsCache = null; };

    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-cancel-withdrawal]')) return;
      var row = e.target.closest && e.target.closest('.commission-txn-row[data-txn-idx]');
      if (!row) return;
      if (e.target.closest && e.target.closest('button[data-cancel-withdrawal]')) return;
      e.preventDefault();
      e.stopPropagation();
      var d = detailFromRow(row);
      if (d) openDetail(d);
    }, { signal: signal });

    document.addEventListener('keydown', function (e) {
      var row = e.target.closest && e.target.closest('.commission-txn-row[data-txn-idx]');
      if (!row || (e.key !== 'Enter' && e.key !== ' ')) return;
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      var d = detailFromRow(row);
      if (d) openDetail(d);
    }, { signal: signal });

    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-close-txn-detail]')) {
        e.preventDefault();
        closeDetail();
      }
    }, { signal: signal });

    document.addEventListener('keydown', function (e) {
      var modal = ensureModal();
      if (e.key === 'Escape' && modal && modal.classList.contains('vn-txn-detail-modal--open')) {
        closeDetail();
      }
    }, { signal: signal });

    window.addEventListener('vinor:express-page-swap', function () {
      txnDetailsCache = null;
      closeDetail();
    }, { signal: signal });
  })();
</script>
