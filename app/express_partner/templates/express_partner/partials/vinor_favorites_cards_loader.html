<script>
(function () {
  var API_URL = {{ url_for('express_partner.api_favorites_cards')|tojson }};

  function onFavoritesPage() {
    try {
      return /\/express\/partner\/favorites\/?$/.test(window.location.pathname || '');
    } catch (_) {
      return false;
    }
  }

  function updateHint(requested, shown) {
    var hint = document.getElementById('favoritesCountHint');
    if (!hint || !hint.isConnected) return;
    if (!requested) {
      hint.classList.add('hidden');
      return;
    }
    if (shown < requested) {
      hint.textContent = shown + ' مورد نمایش داده شد — ' + (requested - shown) + ' فایل دیگر در دسترس نیست';
      hint.classList.remove('hidden');
    } else if (shown) {
      hint.textContent = shown + ' مورد نشان‌شده';
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
    }
  }

  window.vinorLoadFavoritesCards = function vinorLoadFavoritesCards() {
    if (!onFavoritesPage()) return;
    var root = document.getElementById('favoritesCardsRoot');
    var loading = document.getElementById('favoritesLoading');
    if (!root || !root.isConnected || !loading) return;

    var codes = window.vinorReadFavs ? window.vinorReadFavs() : [];
    loading.classList.remove('hidden');
    root.classList.add('hidden');
    root.innerHTML = '';
    updateHint(0, 0);

    fetch(API_URL, {
      method: 'POST',
      headers: window.vinorCsrfFetchHeaders({
        'Content-Type': 'application/json'
      }),
      credentials: 'same-origin',
      body: JSON.stringify({ codes: codes })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('http');
        return r.json();
      })
      .then(function (d) {
        if (!onFavoritesPage()) return;
        if (!root.isConnected) return;
        loading.classList.add('hidden');
        root.classList.remove('hidden');
        if (d && d.ok) {
          root.innerHTML = d.html || '';
          var shown = typeof d.count === 'number' ? d.count : 0;
          var requested = typeof d.requested === 'number' ? d.requested : codes.length;
          updateHint(requested, shown);
          if (d.valid_codes && window.vinorWriteFavs && requested > shown) {
            var curKey = codes.slice().sort().join('\0');
            var valKey = d.valid_codes.slice().sort().join('\0');
            if (curKey !== valKey) window.vinorWriteFavs(d.valid_codes);
          }
        } else {
          root.innerHTML = '<p class="text-center text-sm text-red-400">خطا در بارگذاری نشان‌شده‌ها</p>';
        }
      })
      .catch(function () {
        if (!onFavoritesPage() || !root.isConnected) return;
        loading.classList.add('hidden');
        root.classList.remove('hidden');
        root.innerHTML = '<p class="text-center text-sm text-red-400">خطا در بارگذاری — اتصال را بررسی کنید</p>';
      });
  };

  if (!window.__vinorFavoritesCardsBound) {
    window.__vinorFavoritesCardsBound = true;
    document.addEventListener('vinor-favs-changed', function () {
      window.vinorLoadFavoritesCards();
    });
    document.addEventListener('vinor:express-page-swap', function (ev) {
      var key = ev && ev.detail && ev.detail.navKey;
      if (key === 'favorites') window.vinorLoadFavoritesCards();
    });
    document.addEventListener('DOMContentLoaded', function () {
      if (onFavoritesPage()) window.vinorLoadFavoritesCards();
    });
  }
})();
</script>
