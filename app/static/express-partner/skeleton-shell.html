<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="color-scheme" content="dark light" />
  <title>وینور اکسپرس</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: #030712;
      background-image: radial-gradient(ellipse 90% 55% at 50% 0%, rgba(16, 185, 129, 0.16), transparent 55%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f1f5f9; color: #0f172a; }
      .card { background: #fff; border-color: rgba(0,0,0,.07); }
      .hint { color: #64748b; }
      .btn-sec { background: #e2e8f0; color: #0f172a; }
    }
    .progress { height: 3px; background: rgba(255,255,255,.06); overflow: hidden; }
    .progress i {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      animation: bar 1.1s ease-in-out infinite;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      gap: 22px;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(16,185,129,.14);
      border: 1px solid rgba(52,211,153,.4);
      display: grid; place-items: center;
      margin: 0 auto 12px;
    }
    .logo svg { width: 36px; height: 36px; }
    h1 { font-size: 18px; font-weight: 800; }
    .hint { font-size: 13px; line-height: 1.65; color: #94a3b8; max-width: 20rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; padding: 6px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 600; color: #6ee7b7;
      border: 1px solid rgba(52,211,153,.35);
      background: rgba(6,78,59,.4);
    }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
    .card {
      width: 100%; max-width: 22rem; min-height: 88px;
      border-radius: 16px; border: 1px solid rgba(255,255,255,.08);
      background: rgba(15,23,42,.7);
      position: relative; overflow: hidden;
    }
    .card::after {
      content: ''; position: absolute; inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      animation: shine 1.3s ease-in-out infinite;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 18rem; }
    button, .btn {
      appearance: none; border: 0; border-radius: 14px;
      padding: 12px 18px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; width: 100%;
    }
    .btn { background: #059669; color: #fff; text-decoration: none; display: block; text-align: center; }
    .btn-sec { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .tabs {
      display: flex; justify-content: space-around;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(5,10,14,.95);
    }
    .tabs span {
      width: 44px; height: 34px; border-radius: 12px;
      background: rgba(255,255,255,.06);
    }
    .tabs span:first-child { background: rgba(16,185,129,.22); }
    @keyframes shine { 100% { transform: translateX(100%); } }
    @keyframes bar {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card::after, .progress i { animation: none; }
    }
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"><i></i></div>
  <main>
    <div>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="18" y="19" text-anchor="middle" dominant-baseline="central" fill="#34d399" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="900">V</text>
        </svg>
      </div>
      <h1>وینور اکسپرس</h1>
      <p class="hint" id="offlineHint">آفلاین هستید — نمایش از حافظهٔ آفلاین</p>
      <span class="badge"><i aria-hidden="true"></i> حالت آفلاین</span>
    </div>
    <div class="card" aria-hidden="true"></div>
    <div class="actions">
      <button type="button" class="btn" onclick="location.reload()">تلاش مجدد</button>
      <a class="btn btn-sec" href="/express/partner/login">ورود / ادامه</a>
    </div>
  </main>
  <nav class="tabs" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </nav>
  <script>
    if (navigator.onLine) {
      var h = document.getElementById('offlineHint');
      if (h) h.textContent = 'در حال دریافت آخرین نسخه… اگر طولانی شد، دوباره تلاش کنید.';
    }
  </script>
</body>
</html>
