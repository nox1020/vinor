<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="color-scheme" content="dark light" />
  <title>وینور اکسپرس</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: #030712;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f9fafb; color: #0f172a; }
      .hint { color: #64748b; }
      .btn-sec { background: #e2e8f0; color: #0f172a; }
    }
    .logo {
      width: 36px; height: 36px; border-radius: 8px;
      margin: 0 auto;
      overflow: hidden;
      animation: vinorSkPulse 1.6s ease-in-out infinite;
    }
    .logo img { display: block; width: 36px; height: 36px; object-fit: cover; }
    .hint {
      display: none;
      font-size: 13px; line-height: 1.5; color: #94a3b8;
      max-width: 18rem; margin: 14px auto 0;
    }
    .actions { display: none; flex-direction: column; gap: 8px; width: 100%; max-width: 16rem; margin: 20px auto 0; }
    body.is-offline .hint,
    body.is-offline .actions { display: flex; }
    body.is-offline .hint { display: block; }
    body.is-offline .logo { animation: none; opacity: 0.85; }
    button, .btn {
      appearance: none; border: 0; border-radius: 10px;
      padding: 11px 16px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; width: 100%;
    }
    .btn { background: #059669; color: #fff; text-decoration: none; display: block; text-align: center; }
    .btn-sec { background: rgba(255,255,255,.08); color: #e2e8f0; }
    @keyframes vinorSkPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; opacity: 0.85; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <img src="/static/icons/icon-96.png" alt="" width="36" height="36" decoding="async">
    </div>
    <p class="hint" id="offlineHint">آفلاین — از حافظهٔ ذخیره‌شده</p>
    <div class="actions">
      <button type="button" class="btn" onclick="location.reload()">تلاش مجدد</button>
      <a class="btn btn-sec" href="/express/partner/login">ورود</a>
    </div>
  </main>
  <script>
    (function () {
      function sync() {
        var on = typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
        document.body.classList.toggle('is-offline', !on);
        var h = document.getElementById('offlineHint');
        if (h && !on) h.textContent = 'آفلاین — از حافظهٔ ذخیره‌شده';
      }
      sync();
      window.addEventListener('online', sync);
      window.addEventListener('offline', sync);
    })();
  </script>
</body>
</html>
