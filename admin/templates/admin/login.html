<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark" data-i18n-page-title="login.browser_title">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Vinor Control</title>
  <meta name="description" content="" data-i18n="meta.description" />
  <meta name="vinor-page-title-key" content="login.browser_title" />
  <script>
    (function () {
      var h = location.hostname || '';
      if (location.protocol === 'http:' && (h === 'vinor.ir' || h === 'www.vinor.ir')) {
        location.replace(location.href.replace(/^http:/i, 'https:'));
      }
      try {
        var k = 'vinor.control.lang';
        var v = localStorage.getItem(k);
        if (v !== 'fa' && v !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
          v = String(nav).toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
        }
        document.documentElement.lang = v;
        document.documentElement.dir = v === 'fa' ? 'rtl' : 'ltr';
        document.documentElement.classList.add(v === 'fa' ? 'lang-fa' : 'lang-en');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <script src="{{ url_for('static', filename='vendor/tailwind/tailwindcdn-3.4.17.js') }}"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/vazirmatn.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vinor-control.css') }}">
  <script src="{{ url_for('static', filename='admin/vinor-i18n.js') }}"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 pb-[env(safe-area-inset-bottom,0px)] vc-body" style="background:var(--vc-void)">

  <div class="w-full max-w-md">
    <div class="flex justify-end mb-3">
      <div class="vc-lang-switch" id="loginLangSwitch">
        <button type="button" data-lang="fa" data-i18n="common.fa">FA</button>
        <button type="button" data-lang="en" data-i18n="common.en">EN</button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('admin.login') }}"
          class="rounded-[12px] border p-6 space-y-4" style="background:var(--vc-panel);border-color:var(--vc-line)">

      <div class="text-center space-y-3">
        <img src="{{ url_for('static', filename='icons/icon-96.png') }}" alt="" width="72" height="72" class="mx-auto rounded-xl object-cover" decoding="async">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white" data-i18n="login.title"></h1>
          <p class="text-xs mt-1 text-[#6B7380]" data-i18n="login.tagline"></p>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
          <div class="space-y-2">
            {% for category, msg in messages %}
              {% if 'کد ورود به شماره' not in (msg|string) and 'code sent' not in (msg|string|lower) %}
              <div class="rounded-lg px-4 py-3 border flex items-start gap-2 text-sm"
                   style="border-color:var(--vc-line);background:var(--vc-ink);color:{% if category in ['success','ok'] %}var(--vc-ok){% elif category == 'warning' %}var(--vc-warn){% else %}var(--vc-danger){% endif %}">
                <span class="flex-1">{{ msg }}</span>
              </div>
              {% endif %}
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div>
        <label class="block text-sm font-medium mb-2 text-[#A7B0BE]" data-i18n="login.otp_label"></label>
        <input name="otp_code" type="text" inputmode="numeric" dir="ltr"
               data-i18n-placeholder="login.otp_placeholder"
               class="w-full px-4 py-3 rounded-lg border focusable"
               style="background:var(--vc-panel-2);border-color:var(--vc-line);color:var(--vc-text)">
      </div>
      <div>
        <button type="submit" name="action" value="verify"
                class="w-full px-4 py-3 font-semibold rounded-lg transition-colors focusable"
                style="background:var(--vc-signal);color:#042f2e"
                data-i18n="login.verify"></button>
      </div>
      <div class="rounded-lg border px-3 py-2 text-xs text-center" style="border-color:var(--vc-line);color:var(--vc-text-2)">
        <span id="otpCooldownText" class="font-semibold" style="color:var(--vc-signal)"></span>
      </div>
      <div id="resendWrap" class="hidden">
        <button type="submit" name="action" value="send"
                class="w-full px-4 py-3 font-semibold rounded-lg focusable"
                style="background:var(--vc-panel-2);border:1px solid var(--vc-line);color:var(--vc-text)"
                data-i18n="login.resend"></button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      var base = '{{ url_for("static", filename="admin/locales") }}'.replace(/\/$/, '');
      var remaining = Number({{ otp_cooldown_seconds|default(0) }}) || 0;
      var cooldownText = document.getElementById('otpCooldownText');
      var resendWrap = document.getElementById('resendWrap');

      function paintLangButtons() {
        var lang = VinorI18n.getLanguage();
        document.querySelectorAll('#loginLangSwitch button').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-lang') === lang);
        });
      }

      function renderTimer() {
        if (!cooldownText || !window.t) return;
        if (remaining > 0) {
          cooldownText.textContent = t('login.resend_in', { seconds: formatNumber ? formatNumber(remaining, { maximumFractionDigits: 0 }) : remaining });
          resendWrap && resendWrap.classList.add('hidden');
          remaining -= 1;
        } else {
          cooldownText.textContent = t('login.resend_ready');
          resendWrap && resendWrap.classList.remove('hidden');
        }
      }

      VinorI18n.init({ baseUrl: base }).then(function () {
        paintLangButtons();
        renderTimer();
      });

      document.querySelectorAll('#loginLangSwitch button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          VinorI18n.setLanguage(btn.getAttribute('data-lang')).then(paintLangButtons);
        });
      });

      setInterval(renderTimer, 1000);

      var form = document.querySelector('form');
      var otpInput = document.querySelector('input[name="otp_code"]');
      form && form.addEventListener('submit', function (e) {
        var action = (e.submitter && e.submitter.value || '').toLowerCase();
        if (action === 'send') otpInput && otpInput.removeAttribute('required');
        else otpInput && otpInput.setAttribute('required', 'required');
      });
    })();
  </script>
</body>
</html>
