{% extends 'admin/base_admin.html' %}
{% block title %}{{ page_title or 'پروفایل همکار' }}{% endblock %}
{% block page_title %}{{ page_title or 'پروفایل همکار' }}{% endblock %}

{% block content %}
<div class="space-y-4">
  <a href="{{ url_for('admin.express_partners', q=back_q or '', filter=back_filter or 'all') }}"
     class="inline-flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition">
    <i class="fa-solid fa-arrow-right"></i>
    بازگشت به لیست کاربران
  </a>

  {% include 'admin/partials/person_detail_body.html' %}
</div>

<script>
(function(){
  function fmt(dt){
    try{
      const d = new Date(String(dt||'').replace(' ','T'));
      if (isNaN(d)) return '';
      return d.toLocaleString('fa-IR', { timeZone: 'Asia/Tehran', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    }catch(_){ return ''; }
  }
  document.querySelectorAll('.jalali-dt[data-dt]').forEach(el=>{
    const raw = el.getAttribute('data-dt')||'';
    el.textContent = fmt(raw) || '—';
  });
})();
</script>
{% endblock %}
