<div class="relative z-20 border-t border-white/10 bg-[#0a0f14] px-2 py-2">
  <div class="grid grid-cols-3 gap-1.5">
    <a href="{{ url_for('admin.edit_express_listing', code=land.code) }}"
       class="flex items-center justify-center gap-1 rounded-lg border border-white/15 bg-white/5 px-2 py-2 text-[11px] font-medium text-white hover:bg-white/10 transition focusable">
      <i class="fa-regular fa-pen-to-square text-[10px]"></i>
      ویرایش
    </a>
    <form method="post" action="{{ url_for('admin.toggle_express_sold', code=land.code) }}" class="min-w-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit"
              class="w-full flex items-center justify-center gap-1 rounded-lg border border-white/15 bg-white/5 px-2 py-2 text-[11px] font-medium text-white hover:bg-white/10 transition focusable">
        {% if land.express_status == 'sold' %}
        <i class="fa-solid fa-rotate-left text-[10px]"></i>
        <span class="truncate">فعال</span>
        {% else %}
        <i class="fa-solid fa-check-double text-[10px]"></i>
        <span class="truncate">فروخته</span>
        {% endif %}
      </button>
    </form>
    <form method="post" action="{{ url_for('admin.delete_express_listing', code=land.code) }}"
          class="min-w-0 js-delete-listing-form"
          data-listing-title="{{ land.title or 'بدون عنوان' }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit"
              class="w-full flex items-center justify-center gap-1 rounded-lg border border-red-500/40 bg-red-950/40 px-2 py-2 text-[11px] font-medium text-red-300 hover:bg-red-950/60 transition focusable">
        <i class="fa-solid fa-trash text-[10px]"></i>
        حذف
      </button>
    </form>
  </div>
  {% if land.created_at %}
  <p class="mt-1.5 text-center text-[10px] text-slate-500 jalali-dt" data-dt="{{ land.created_at }}"></p>
  {% endif %}
</div>
