            tests/test_fcm_notification_sound.py
            tests/test_notification_debug_removed.py
            tests/test_visit_request_form.py
            tests/test_upload_auth.py
            tests/test_visit_delivery_owner.py
            tests/test_roles_phase5.py
            tests/test_visit_result_phase2.py
            tests/test_zarinpal_plus.py
            tests/test_listing_first_week.py
            tests/test_imgtype_compat.py
            tests/test_adaptive_layer.py
            tests/test_agent_goal.py
            tests/test_agents_layer.py
            tests/test_ai_console.py
